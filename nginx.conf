server {
    listen       8080;
    server_name  localhost;

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://mc.yandex.ru; font-src 'self' data:; connect-src 'self' https://mc.yandex.ru https://trueruslan-ai-navigator-ai8-full-production.trueruslan.workers.dev; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    location ~* \.(css|js|woff2?)$ {
        root /usr/share/nginx/html;
        expires 7d;
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|gif|webp|svg|ico|pdf)$ {
        root /usr/share/nginx/html;
        expires 1h;
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        expires -1;
        try_files $uri $uri/ =404;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
