<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">NODE ZERO gameplay and system-state flow</title>
  <desc id="desc">Flow between player behavior, reusable gameplay systems, facility state, MIRROR prediction, authored sequences and player-visible constraints.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090B10"/><stop offset="1" stop-color="#151225"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#718095"/></marker>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <text x="58" y="58" fill="#B9A8FF" font-family="ui-monospace,monospace" font-size="15" font-weight="700" letter-spacing="1">VERTICAL SLICE / SYSTEM STATE FLOW</text>

  <rect x="55" y="110" width="220" height="110" rx="18" fill="#11151C" stroke="#4CC9F0" stroke-width="2"/>
  <text x="82" y="154" fill="#F4F7FB" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="23" font-weight="600">Player behavior</text>
  <text x="82" y="187" fill="#9CABBC" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="500">movement · choices · tasks</text>

  <rect x="345" y="110" width="245" height="110" rx="18" fill="#11151C" stroke="#4ADE80" stroke-width="2"/>
  <text x="372" y="154" fill="#F4F7FB" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="23" font-weight="600">Gameplay systems</text>
  <text x="372" y="187" fill="#9CABBC" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="500">interaction · access · tasks</text>

  <rect x="660" y="110" width="230" height="110" rx="18" fill="#11151C" stroke="#4CC9F0" stroke-width="2"/>
  <text x="687" y="154" fill="#F4F7FB" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="23" font-weight="600">Facility state</text>
  <text x="687" y="187" fill="#9CABBC" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="500">routes · power · telemetry</text>

  <rect x="960" y="110" width="185" height="110" rx="18" fill="#11151C" stroke="#8B5CF6" stroke-width="2"/>
  <text x="988" y="154" fill="#F4F7FB" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="23" font-weight="600">MIRROR</text>
  <text x="988" y="187" fill="#9CABBC" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="500">prediction model</text>

  <path d="M275 165H345M590 165H660M890 165H960" stroke="#718095" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <rect x="130" y="340" width="300" height="125" rx="18" fill="#11151C" stroke="#8B5CF6" stroke-width="2"/>
  <text x="160" y="388" fill="#F4F7FB" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="23" font-weight="600">Authored sequences</text>
  <text x="160" y="422" fill="#9CABBC" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="500">story beats · scares · evidence</text>

  <rect x="500" y="340" width="290" height="125" rx="18" fill="#11151C" stroke="#4ADE80" stroke-width="2"/>
  <text x="530" y="388" fill="#F4F7FB" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="23" font-weight="600">Constraint changes</text>
  <text x="530" y="422" fill="#9CABBC" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="500">access · route · information</text>

  <rect x="860" y="340" width="260" height="125" rx="18" fill="#11151C" stroke="#4CC9F0" stroke-width="2"/>
  <text x="890" y="388" fill="#F4F7FB" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="23" font-weight="600">Player-visible state</text>
  <text x="890" y="422" fill="#9CABBC" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="500">new options and uncertainty</text>

  <path d="M1050 220V275H645V340M430 402H500M790 402H860" stroke="#718095" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M990 465V510H165V220" stroke="#718095" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <rect x="95" y="530" width="1010" height="52" rx="14" fill="#11121B" stroke="#3B2A69"/>
  <text x="120" y="562" fill="#9CABBC" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="500">Rule: MIRROR changes constraints and context; reusable gameplay systems remain independent from one-off narrative scripting.</text>
</svg>
