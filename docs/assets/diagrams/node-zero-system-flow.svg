<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">NODE ZERO gameplay and system-state flow</title>
  <desc id="desc">Flow between player behavior, reusable gameplay systems, facility state, MIRROR prediction, authored sequences and player-visible constraints.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090B10"/><stop offset="1" stop-color="#151225"/></linearGradient>
    <style>
      .box{fill:#11151c;stroke:#334155;stroke-width:2}.violet{stroke:#8b5cf6}.cyan{stroke:#4cc9f0}.green{stroke:#4ade80}.t{fill:#f4f7fb;font:600 23px system-ui}.s{fill:#9cabbc;font:500 16px system-ui}.k{fill:#b9a8ff;font:700 15px ui-monospace,monospace;letter-spacing:1px}.a{stroke:#718095;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#718095"/></marker>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <text x="58" y="58" class="k">VERTICAL SLICE / SYSTEM STATE FLOW</text>
  <rect x="55" y="110" width="220" height="110" rx="18" class="box cyan"/><text x="82" y="154" class="t">Player behavior</text><text x="82" y="187" class="s">movement · choices · tasks</text>
  <rect x="345" y="110" width="245" height="110" rx="18" class="box green"/><text x="372" y="154" class="t">Gameplay systems</text><text x="372" y="187" class="s">interaction · access · tasks</text>
  <rect x="660" y="110" width="230" height="110" rx="18" class="box cyan"/><text x="687" y="154" class="t">Facility state</text><text x="687" y="187" class="s">routes · power · telemetry</text>
  <rect x="960" y="110" width="185" height="110" rx="18" class="box violet"/><text x="988" y="154" class="t">MIRROR</text><text x="988" y="187" class="s">prediction model</text>
  <path d="M275 165H345M590 165H660M890 165H960" class="a"/>
  <rect x="130" y="340" width="300" height="125" rx="18" class="box violet"/><text x="160" y="388" class="t">Authored sequences</text><text x="160" y="422" class="s">story beats · scares · evidence</text>
  <rect x="500" y="340" width="290" height="125" rx="18" class="box green"/><text x="530" y="388" class="t">Constraint changes</text><text x="530" y="422" class="s">access · route · information</text>
  <rect x="860" y="340" width="260" height="125" rx="18" class="box cyan"/><text x="890" y="388" class="t">Player-visible state</text><text x="890" y="422" class="s">new options and uncertainty</text>
  <path d="M1050 220V275H645V340M430 402H500M790 402H860" class="a"/>
  <path d="M990 465V510H165V220" class="a"/>
  <rect x="95" y="530" width="1010" height="52" rx="14" fill="#11121b" stroke="#3b2a69"/>
  <text x="120" y="562" class="s">Rule: MIRROR changes constraints and context; reusable gameplay systems remain independent from one-off narrative scripting.</text>
</svg>
