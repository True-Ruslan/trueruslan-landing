name: External health

on:
  schedule:
    - cron: '20 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check public endpoints
        run: node scripts/external-health.js
      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-health-report
          path: health-artifacts/
          if-no-files-found: warn
          retention-days: 30
