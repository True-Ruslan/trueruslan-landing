name: External health

on:
  schedule:
    - cron: '20 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  external-health:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Resolve site deployment contract
        env:
          SITE_DEPLOYMENT_MODE: auto
          TR_PRODUCTION_SITE_URL: ${{ vars.TR_PRODUCTION_SITE_URL }}
        run: node scripts/site-deployment.js
      - name: Resolve analytics deployment contract
        env:
          ANALYTICS_DEPLOYMENT_MODE: auto
          ANALYTICS_SITE_TOKEN: ${{ vars.TR_CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
        run: node scripts/analytics-deployment.js
      - name: Check public endpoints
        run: node scripts/external-health.js
      - name: Verify production Pages and analytics state
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${ANALYTICS_EXPECTATION}" != "enabled" && "${ANALYTICS_EXPECTATION}" != "disabled" ]]; then
            echo "Invalid analytics expectation: ${ANALYTICS_EXPECTATION}"
            exit 1
          fi
          EXPECTED_SITE_ORIGIN="${SITE_URL}" node scripts/production-smoke.js "${PRODUCTION_URL}"
      - name: Upload health and production reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: external-health-report
          path: |
            health-artifacts/
            production-smoke-report.json
            site-deployment-contract.json
            analytics-deployment-contract.json
          if-no-files-found: warn
          retention-days: 30
