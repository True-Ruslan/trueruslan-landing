name: Branch VillAIgence case-study reconciliation

on:
  push:
    branches:
      - fix/villaigence-031-case-study

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/villaigence-031-case-study
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Reconcile case-study truth and acceptance contracts
        run: node scripts/branch-villaigence-case-study-reconcile.cjs
      - name: Remove branch-only helpers
        run: |
          rm scripts/branch-villaigence-case-study-reconcile.cjs
          rm .github/workflows/branch-villaigence-case-study-reconcile.yml
      - name: Commit reconciled files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/landing/projects/livingworld.md docs/en/projects/livingworld.md scripts/flagship-normalization.test.js scripts/production-flagship-normalization-smoke.cjs scripts/branch-villaigence-case-study-reconcile.cjs .github/workflows/branch-villaigence-case-study-reconcile.yml
          git diff --cached --check
          git commit -m "fix: reconcile VillAIgence 0.3.1 case-study truth"
          git push origin HEAD:fix/villaigence-031-case-study
