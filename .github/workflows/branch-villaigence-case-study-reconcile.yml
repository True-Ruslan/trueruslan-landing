name: Branch VillAIgence case-study reconciliation

on:
  push:
    branches:
      - fix/villaigence-031-case-study

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/villaigence-031-case-study
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Reconcile case-study truth and acceptance contracts
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function read(path) { return fs.readFileSync(path, 'utf8'); }
          function write(path, value) { fs.writeFileSync(path, value, 'utf8'); }
          function replaceExact(source, oldValue, newValue, label) {
            if (!source.includes(oldValue)) throw new Error(`Missing exact replacement target: ${label}`);
            const first = source.indexOf(oldValue);
            if (source.indexOf(oldValue, first + 1) !== -1) throw new Error(`Replacement target is not unique: ${label}`);
            return source.replace(oldValue, newValue);
          }
          function replaceBetween(source, startMarker, endMarker, replacement, label) {
            const start = source.indexOf(startMarker);
            const end = source.indexOf(endMarker, start + startMarker.length);
            if (start < 0 || end < 0 || end <= start) throw new Error(`Missing section boundary: ${label}`);
            return source.slice(0, start + startMarker.length) + '\n' + replacement.trim() + '\n\n' + source.slice(end);
          }

          const ruPath = 'docs/landing/projects/livingworld.md';
          let ru = read(ruPath);
          ru = replaceExact(
            ru,
            '<dd>Официальный 0.2.0+1.21.1 с bounded installed Memory 2.0 acceptance; следующие semantic-memory изменения остаются отдельными срезами.</dd>',
            '<dd>Официальный 0.3.1+1.21.1 опубликован; exact installed corrective canary остаётся PENDING, поэтому release-candidate acceptance всё ещё не завершён.</dd>',
            'RU glance result',
          );
          ru = replaceBetween(
            ru,
            '<!-- case-study:current-state -->',
            '<!-- case-study:decisions -->',
            `## Текущая lifecycle- и acceptance-граница

Публичный lifecycle остаётся **release-candidate — ACCEPTANCE IN PROGRESS**. Текущий официальный release — **0.3.1+1.21.1**. Он опубликован после bounded targeted Memory 2.0 recall correction из **PR #165**; **PR #167** зафиксировал handoff для exact installed corrective acceptance. Automated release и post-release gates прошли, но installed corrective **VAI-PCM-MULTI-001** canary на retained server world всё ещё **PENDING**.

Последний полностью принятый installed baseline остаётся историческим **0.2.0+1.21.1 — 7 PASS / 0 FAIL**. Публикация 0.3.1 не переписывает этот installed evidence и не означает installed PASS для новых corrective bytes. **VAI-M2-INST-005** остаётся NOT TESTED / automated evidence only, **VAI-CONCUR-004** — NOT TESTED / DEFERRED.

До реального installed PASS corrective canary **0.4 remains blocked**. Release identity, merged source capability, automated release gates и installed gameplay acceptance остаются разными фактами.`,
            'RU current state',
          );
          ru = replaceBetween(
            ru,
            '<!-- case-study:evidence -->',
            '<!-- case-study:limitations -->',
            `## Что подтверждено

<div data-tr-project-evidence="livingworld"></div>

Evidence intentionally разделяет:

- исторический \`0.1.20\` partial PASS;
- \`0.1.21\` startup failure и safe rollback;
- corrective PRs и M11 GameTests/production-JAR gates;
- PR #110 как merged shared-deadline/exactly-once automation;
- официальный \`0.2.0+1.21.1\` release и byte-identical clean-world installed result **7 PASS / 0 FAIL** как последний полностью принятый installed baseline;
- \`VAI-M2-INST-005\` и \`VAI-CONCUR-004\` как explicit NOT TESTED boundaries;
- PR #123 и PR #125 как merged bounded semantic-memory source capabilities без AI→FACT authority;
- официальный corrective release **0.3.1+1.21.1**;
- **PR #165** как targeted Memory 2.0 recall correction;
- **PR #167** как installed corrective acceptance handoff;
- exact installed **VAI-PCM-MULTI-001** corrective canary как **PENDING**; **0.4 remains blocked** до реального installed PASS.

Статус \`verified\` относится только к перечисленным scopes и актуальности snapshot. Он не превращает опубликованный 0.3.1 в installed acceptance и не позволяет считать deferred/pending cases пройденными.`,
            'RU evidence',
          );
          ru = replaceBetween(
            ru,
            '<!-- case-study:limitations -->',
            '<!-- case-study:related -->',
            `## Известные ограничения

- exact installed \`VAI-PCM-MULTI-001\` canary для официального 0.3.1 остаётся **PENDING**;
- \`VAI-M2-INST-005\` остаётся NOT TESTED / AUTOMATED EVIDENCE ONLY;
- \`VAI-CONCUR-004\` остаётся NOT TESTED / DEFERRED до доступности двух реальных графических клиентов;
- physical microphone/provider/Voice Chat quality остаётся отдельным observational layer от deterministic loopback contracts;
- публикация 0.3.1 и green automated release gates не доказывают installed corrective acceptance;
- semantic BELIEF admission и recall correction не разрешают AI→FACT path;
- final promotion beyond \`release-candidate\` не выводится автоматически из publication или source CI;
- Fabric остаётся primary package, а NeoForge — compatibility build с отдельными границами проверки.

<!-- case-study:next -->
## Следующий принятый шаг

Следующий bounded acceptance slice — **exact 0.3.1 installed VAI-PCM-MULTI-001 corrective canary** из PR #167.

Нужно установить официальный \`0.3.1+1.21.1\` JAR, проверить SHA-256 \`f7f40b920c6f72a0e9af864795f48a0f90479db42a145081f43923b71a95e29f\`, переиспользовать retained crowded-history world и выполнить exact-text Muammer/Nurey isolation + persistence procedure. Только реальный installed PASS может закрыть corrective boundary и разблокировать 0.4.

До этого lifecycle остаётся \`release-candidate\` / \`ACCEPTANCE IN PROGRESS\`; source, release и installed evidence не схлопываются в один статус.`,
            'RU limitations and next',
          );
          write(ruPath, ru);

          const enPath = 'docs/en/projects/livingworld.md';
          let en = read(enPath);
          en = replaceExact(
            en,
            '<dd>Official 0.2.0+1.21.1 with bounded installed Memory 2.0 acceptance; later semantic-memory work remains a separate boundary.</dd>',
            '<dd>Official 0.3.1+1.21.1 is published; the exact installed corrective canary remains PENDING, so release-candidate acceptance is still in progress.</dd>',
            'EN glance result',
          );
          en = replaceBetween(
            en,
            '<!-- case-study:current-state -->',
            '<!-- case-study:decisions -->',
            `## Current lifecycle and acceptance boundary

The public lifecycle remains **release-candidate — ACCEPTANCE IN PROGRESS**. The current official release is **0.3.1+1.21.1**. It was published after the bounded targeted Memory 2.0 recall correction in **PR #165**; **PR #167** records the handoff for exact installed corrective acceptance. Automated release and post-release gates pass, but the installed corrective **VAI-PCM-MULTI-001** canary on the retained server world is still **PENDING**.

The last fully accepted installed baseline remains the historical **0.2.0+1.21.1 — 7 PASS / 0 FAIL**. Publishing 0.3.1 does not rewrite that installed evidence and does not imply an installed PASS for the new corrective bytes. **VAI-M2-INST-005** remains NOT TESTED / automated evidence only and **VAI-CONCUR-004** remains NOT TESTED / DEFERRED.

Until the corrective canary has real installed PASS evidence, **0.4 remains blocked**. Release identity, merged source capability, automated release gates and installed gameplay acceptance remain separate facts.`,
            'EN current state',
          );
          en = replaceBetween(
            en,
            '<!-- case-study:evidence -->',
            '<!-- case-study:limitations -->',
            `## Evidence boundary

The complete Project Evidence snapshot and timeline remain on the [Russian canonical VillAIgence page](../../landing/projects/livingworld.md). They are generated from shared registries rather than copied into a second English evidence model.

The current bounded snapshot separates the historical \`0.2.0+1.21.1\` installed **7 PASS / 0 FAIL** baseline from the official **0.3.1+1.21.1** corrective release. **PR #165** is the targeted Memory 2.0 recall correction, **PR #167** is the installed corrective acceptance handoff, and the exact installed **VAI-PCM-MULTI-001** canary is still **PENDING**. **0.4 remains blocked** until that real installed acceptance exists. Deferred \`VAI-M2-INST-005\` and \`VAI-CONCUR-004\` boundaries remain explicit.`,
            'EN evidence',
          );
          en = replaceBetween(
            en,
            '<!-- case-study:limitations -->',
            '<!-- case-study:related -->',
            `## Known limitations

- the exact installed \`VAI-PCM-MULTI-001\` canary for official 0.3.1 remains **PENDING**;
- \`VAI-M2-INST-005\` remains NOT TESTED / automated evidence only;
- \`VAI-CONCUR-004\` remains NOT TESTED / deferred;
- physical microphone/provider/Voice Chat quality remains observational evidence separate from deterministic protocol tests;
- publishing 0.3.1 and passing automated release gates do not prove installed corrective acceptance;
- semantic BELIEF admission and the recall correction do not permit AI→FACT authority;
- publication does not automatically promote the public lifecycle beyond release-candidate;
- Fabric remains the primary package while NeoForge is a compatibility build with separate boundaries.

<!-- case-study:next -->
## Next accepted milestone

Run the **exact 0.3.1 installed VAI-PCM-MULTI-001 corrective canary** defined by PR #167.

Install the official \`0.3.1+1.21.1\` JAR, verify SHA-256 \`f7f40b920c6f72a0e9af864795f48a0f90479db42a145081f43923b71a95e29f\`, reuse the retained crowded-history world, and execute the exact-text Muammer/Nurey isolation and persistence procedure. Only real installed PASS evidence may close the corrective boundary and unblock 0.4.

Until then the lifecycle remains \`release-candidate / ACCEPTANCE IN PROGRESS\`; source, release and installed evidence are not collapsed into one status.`,
            'EN limitations and next',
          );
          write(enPath, en);

          const testPath = 'scripts/flagship-normalization.test.js';
          let test = read(testPath);
          test = replaceExact(
            test,
            `    '0.2.0+1.21.1',\n    '7 PASS / 0 FAIL',\n    'PR #153',\n    'PR #155',\n    'Draft',`,
            `    '0.3.1+1.21.1',\n    '7 PASS / 0 FAIL',\n    'PR #165',\n    'PR #167',\n    'VAI-PCM-MULTI-001',\n    'PENDING',\n    '0.4 remains blocked',`,
            'RU local flagship markers',
          );
          test = replaceExact(
            test,
            `    '0.2.0+1.21.1',\n    '7 PASS / 0 FAIL',\n    'PR #153',\n    'PR #155',`,
            `    '0.3.1+1.21.1',\n    '7 PASS / 0 FAIL',\n    'PR #165',\n    'PR #167',\n    'VAI-PCM-MULTI-001',\n    'PENDING',\n    '0.4 remains blocked',`,
            'EN local flagship markers',
          );
          write(testPath, test);

          const productionPath = 'scripts/production-flagship-normalization-smoke.cjs';
          let production = read(productionPath);
          production = replaceExact(
            production,
            `        'PR #123',\n        'PR #125',\n        'VAI-M2-INST-005',\n        'VAI-CONCUR-004',\n        'Draft',`,
            `        'PR #165',\n        'PR #167',\n        'VAI-PCM-MULTI-001',\n        'PENDING',\n        '0.4 remains blocked',\n        'VAI-M2-INST-005',\n        'VAI-CONCUR-004',`,
            'RU production flagship markers',
          );
          production = replaceExact(
            production,
            `        'PR #123',\n        'PR #125',`,
            `        'PR #165',\n        'PR #167',\n        'VAI-PCM-MULTI-001',\n        'PENDING',`,
            'RU evidence production markers',
          );
          production = replaceExact(
            production,
            `        'PR #123',\n        'PR #125',\n        'VAI-M2-INST-005',\n        'VAI-CONCUR-004',\n        'Draft',`,
            `        'PR #165',\n        'PR #167',\n        'VAI-PCM-MULTI-001',\n        'PENDING',\n        '0.4 remains blocked',\n        'VAI-M2-INST-005',\n        'VAI-CONCUR-004',`,
            'EN production flagship markers',
          );
          write(productionPath, production);
          NODE
      - name: Remove branch-only helper workflow
        run: rm .github/workflows/branch-villaigence-case-study-reconcile.yml
      - name: Commit reconciled files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/landing/projects/livingworld.md docs/en/projects/livingworld.md scripts/flagship-normalization.test.js scripts/production-flagship-normalization-smoke.cjs .github/workflows/branch-villaigence-case-study-reconcile.yml
          git diff --cached --check
          git commit -m "fix: reconcile VillAIgence 0.3.1 case-study truth"
          git push origin HEAD:fix/villaigence-031-case-study
