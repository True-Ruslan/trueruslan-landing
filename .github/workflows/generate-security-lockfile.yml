name: Capture dependency security evidence

on:
  pull_request:
    branches:
      - master
    paths:
      - package.json
      - package-lock.json
      - scripts/dependency-security.test.js
      - .github/workflows/generate-security-lockfile.yml

permissions:
  contents: read

concurrency:
  group: dependency-security-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.1.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.6.0
        with:
          node-version: '24'
          cache: npm

      - name: Install reproducibly
        run: npm ci

      - name: Verify dependency security tests
        run: node --test scripts/dependency-security.test.js

      - name: Capture parser tree
        run: npm ls fast-xml-parser --all > fast-xml-parser-tree.txt

      - name: Capture current audit
        shell: bash
        run: npm audit --json > npm-audit.json || true

      - name: Upload dependency security evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-security-evidence
          path: |
            package-lock.json
            fast-xml-parser-tree.txt
            npm-audit.json
          if-no-files-found: error
          retention-days: 14
