name: C3 summary ordering fix

on:
  push:
    branches:
      - feat/portfolio-clarity-c3-projects
    paths:
      - scripts/c3-order-fix.mjs
      - .github/workflows/c3-order-fix.yml

permissions:
  contents: write

jobs:
  fix-order:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout C3 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/portfolio-clarity-c3-projects

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Move summaries before timelines
        run: node scripts/c3-order-fix.mjs

      - name: Verify focused source contracts
        run: |
          node --test scripts/portfolio-clarity-c3.test.js
          node --test scripts/portfolio-p3-5a-english-vlezet.test.js

      - name: Commit ordering fix and remove temporary migration files
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/c3-order-fix.mjs .github/workflows/c3-order-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/landing/projects docs/en/projects scripts/c3-order-fix.mjs .github/workflows/c3-order-fix.yml
          git diff --cached --check
          git commit -m 'fix: order C3 summaries before timelines'
          git push origin HEAD:feat/portfolio-clarity-c3-projects
