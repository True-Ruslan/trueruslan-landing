name: C7 durable acceptance migration

on:
  push:
    branches:
      - docs/portfolio-clarity-c7-durable-acceptance
    paths:
      - '.github/workflows/c7-durable-migrate.yml'
      - 'scripts/migrate-c7-durable-acceptance.py'

permissions:
  contents: write

concurrency:
  group: c7-durable-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact durable branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/portfolio-clarity-c7-durable-acceptance
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Skip after one-shot migration cleanup
        id: guard
        shell: bash
        run: |
          if [[ ! -f scripts/migrate-c7-durable-acceptance.py ]]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'One-shot migration script is absent; nothing to do.'
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: npm ci

      - name: Apply fail-closed C7 durable migration
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/migrate-c7-durable-acceptance.py
          git diff --check
          node --test \
            scripts/portfolio-clarity-c7.test.js \
            scripts/portfolio-clarity-c7-durable-acceptance.test.js \
            scripts/measurement-checkpoint-report.test.js

      - name: Commit durable state
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add \
            data/presentation-baseline.json \
            docs/PROJECT_STATE.md \
            docs/ROADMAP.md \
            docs/CHANGELOG.md \
            docs/acceptance/2026-08-11-portfolio-clarity-c7.md \
            docs/keystone/specs/2026-08-11-portfolio-clarity-c7-baseline-handoff.md \
            scripts/portfolio-clarity-c7.test.js
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: record C7 production acceptance'
          git push origin HEAD:docs/portfolio-clarity-c7-durable-acceptance
