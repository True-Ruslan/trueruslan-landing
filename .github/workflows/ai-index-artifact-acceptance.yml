name: AI Index Artifact Acceptance

on:
  workflow_run:
    workflows: [Build]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ai-index-artifact-acceptance-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  gate:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      pull-requests: read
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      pr_number: ${{ steps.gate.outputs.pr_number }}
      candidate_sha: ${{ steps.gate.outputs.candidate_sha }}
      head_ref: ${{ steps.gate.outputs.head_ref }}
      maintenance_run_id: ${{ steps.gate.outputs.maintenance_run_id }}
      artifact_id: ${{ steps.gate.outputs.artifact_id }}
      artifact_digest: ${{ steps.gate.outputs.artifact_digest }}
    steps:
      - name: Resolve and authorize exact owner PR
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          echo "authorized=false" >> "$GITHUB_OUTPUT"

          if [ "$WORKFLOW_EVENT" != "pull_request" ]; then
            echo "Completed Build is not a pull-request run; artifact acceptance is not requested."
            exit 0
          fi
          if [ "$WORKFLOW_HEAD_REPO" != "$GITHUB_REPOSITORY" ] || ! [[ "$WORKFLOW_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Completed Build is not an exact same-repository candidate; artifact acceptance is not requested."
            exit 0
          fi
          if [ -z "$WORKFLOW_HEAD_BRANCH" ]; then
            echo "Completed Build has no head branch; artifact acceptance is not requested."
            exit 0
          fi

          PRS_JSON="$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
            -f state=open \
            -f head="$REPOSITORY_OWNER:$WORKFLOW_HEAD_BRANCH" \
            -f per_page=100)"
          PR_COUNT="$(jq 'length' <<< "$PRS_JSON")"
          if [ "$PR_COUNT" -ne 1 ]; then
            echo "Completed Build branch does not resolve to exactly one open owner PR; artifact acceptance is not requested."
            exit 0
          fi

          PR_JSON="$(jq '.[0]' <<< "$PRS_JSON")"
          PR_NUMBER="$(jq -r '.number' <<< "$PR_JSON")"
          PR_STATE="$(jq -r '.state' <<< "$PR_JSON")"
          PR_AUTHOR="$(jq -r '.user.login' <<< "$PR_JSON")"
          BASE_REF="$(jq -r '.base.ref' <<< "$PR_JSON")"
          HEAD_SHA="$(jq -r '.head.sha' <<< "$PR_JSON")"
          HEAD_REPO="$(jq -r '.head.repo.full_name' <<< "$PR_JSON")"
          HEAD_REF="$(jq -r '.head.ref' <<< "$PR_JSON")"
          PR_BODY="$(jq -r '.body // ""' <<< "$PR_JSON")"
          COMMAND_LINE="${PR_BODY%%$'\n'*}"

          if [ "$PR_STATE" != "open" ] || [ "$PR_AUTHOR" != "$REPOSITORY_OWNER" ] || [ "$BASE_REF" != "master" ]; then
            echo "Resolved PR is outside the owner/master acceptance boundary."
            exit 0
          fi
          if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ] || [ "$HEAD_SHA" != "$WORKFLOW_HEAD_SHA" ]; then
            echo "Resolved PR no longer matches the completed Build head."
            exit 0
          fi
          if [ "$HEAD_REF" = "master" ] || ! [[ "$HEAD_REF" =~ ^[A-Za-z0-9._/-]+$ ]] || [[ "$HEAD_REF" == -* ]] || [[ "$HEAD_REF" == *".."* ]]; then
            echo "Resolved PR head ref is not a safe writable feature branch."
            exit 0
          fi

          read -r COMMAND CANDIDATE_SHA MAINTENANCE_RUN_ID ARTIFACT_ID ARTIFACT_DIGEST CONFIRMATION EXTRA <<< "$COMMAND_LINE"
          if [ "$COMMAND" != "/accept-ai-index" ]; then
            echo "No explicit AI-index artifact acceptance command is present."
            exit 0
          fi
          if [ -n "${EXTRA:-}" ] || ! [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]] || [ "$CANDIDATE_SHA" != "$HEAD_SHA" ]; then
            echo "AI-index artifact acceptance command is stale or malformed; leaving it unauthorized."
            exit 0
          fi
          if ! [[ "$MAINTENANCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || ! [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "AI-index maintenance run or artifact identity is invalid; leaving it unauthorized."
            exit 0
          fi
          if ! [[ "$ARTIFACT_DIGEST" =~ ^[a-f0-9]{64}$ ]] || [ "$CONFIRMATION" != "CONFIRM_AI_INDEX_ARTIFACT_ACCEPTANCE" ]; then
            echo "AI-index artifact digest or explicit confirmation is invalid; leaving it unauthorized."
            exit 0
          fi

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
          echo "maintenance_run_id=$MAINTENANCE_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=$ARTIFACT_DIGEST" >> "$GITHUB_OUTPUT"
          echo "authorized=true" >> "$GITHUB_OUTPUT"

  accept:
    needs: gate
    if: needs.gate.outputs.authorized == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      actions: read
      contents: write
      pull-requests: read
    steps:
      - name: Verify reviewed maintenance artifact locally
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
          CANDIDATE_SHA: ${{ needs.gate.outputs.candidate_sha }}
          HEAD_REF: ${{ needs.gate.outputs.head_ref }}
          MAINTENANCE_RUN_ID: ${{ needs.gate.outputs.maintenance_run_id }}
          ARTIFACT_ID: ${{ needs.gate.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.gate.outputs.artifact_digest }}
          TRUSTED_SHA: ${{ github.sha }}
          MAX_ARTIFACT_BYTES: '1000000'
          MAX_UNCOMPRESSED_BYTES: '2000000'
        run: |
          set -euo pipefail
          WORK_DIR="$RUNNER_TEMP/ai-index-artifact-acceptance"
          ZIP_PATH="$WORK_DIR/artifact.zip"
          EXTRACT_DIR="$WORK_DIR/extracted"
          RESTORE_PATH="$WORK_DIR/ai-index-restore.js"
          mkdir -p "$EXTRACT_DIR"

          RUN_JSON="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$MAINTENANCE_RUN_ID")"
          RUN_NAME="$(jq -r '.name' <<< "$RUN_JSON")"
          RUN_EVENT="$(jq -r '.event' <<< "$RUN_JSON")"
          RUN_PATH="$(jq -r '.path' <<< "$RUN_JSON")"
          if [ "$RUN_NAME" != "AI Index Content Maintenance" ] || [ "$RUN_EVENT" != "workflow_run" ] || \
             [ "$RUN_PATH" != ".github/workflows/ai-index-content-maintenance.yml" ]; then
            echo "::error::Referenced run is not the trusted AI-index maintenance workflow."
            exit 1
          fi

          JOBS_JSON="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$MAINTENANCE_RUN_ID/jobs?per_page=100" | jq -s '[.[].jobs[]]')"
          MAINTENANCE_SUCCESS="$(jq '[.[] | select(.name == "maintenance" and .conclusion == "success")] | length' <<< "$JOBS_JSON")"
          GATE_SUCCESS="$(jq '[.[] | select(.name == "workflow_run_gate" and .conclusion == "success")] | length' <<< "$JOBS_JSON")"
          if [ "$MAINTENANCE_SUCCESS" -ne 1 ] || [ "$GATE_SUCCESS" -ne 1 ]; then
            echo "::error::Trusted maintenance gate/provider job did not each succeed exactly once."
            exit 1
          fi

          ARTIFACT_JSON="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID")"
          EXPECTED_NAME="ai-index-content-maintenance-$PR_NUMBER-$MAINTENANCE_RUN_ID"
          ARTIFACT_SIZE="$(jq -r '.size_in_bytes' <<< "$ARTIFACT_JSON")"
          if [ "$(jq -r '.name' <<< "$ARTIFACT_JSON")" != "$EXPECTED_NAME" ] || \
             [ "$(jq -r '.expired' <<< "$ARTIFACT_JSON")" != "false" ] || \
             [ "$(jq -r '.workflow_run.id' <<< "$ARTIFACT_JSON")" != "$MAINTENANCE_RUN_ID" ]; then
            echo "::error::Artifact identity, retention state or source run does not match reviewed evidence."
            exit 1
          fi
          if ! [[ "$ARTIFACT_SIZE" =~ ^[0-9]+$ ]] || [ "$ARTIFACT_SIZE" -gt "$MAX_ARTIFACT_BYTES" ]; then
            echo "::error::Reviewed artifact exceeds the bounded compressed-size contract."
            exit 1
          fi
          if [ "$(jq -r '.digest // ""' <<< "$ARTIFACT_JSON")" != "sha256:$ARTIFACT_DIGEST" ]; then
            echo "::error::GitHub artifact digest does not match explicit operator acceptance."
            exit 1
          fi

          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$ZIP_PATH"
          ACTUAL_ZIP_SIZE="$(stat -c '%s' "$ZIP_PATH")"
          if [ "$ACTUAL_ZIP_SIZE" -gt "$MAX_ARTIFACT_BYTES" ]; then
            echo "::error::Downloaded artifact exceeds the bounded compressed-size contract."
            exit 1
          fi
          printf '%s  %s\n' "$ARTIFACT_DIGEST" "$ZIP_PATH" | sha256sum --check --strict

          ZIP_PATH="$ZIP_PATH" EXTRACT_DIR="$EXTRACT_DIR" MAX_UNCOMPRESSED_BYTES="$MAX_UNCOMPRESSED_BYTES" python3 - <<'PY'
          import os
          import pathlib
          import stat
          import zipfile

          zip_path = pathlib.Path(os.environ['ZIP_PATH'])
          extract_dir = pathlib.Path(os.environ['EXTRACT_DIR'])
          max_bytes = int(os.environ['MAX_UNCOMPRESSED_BYTES'])
          expected = {
              'data/ai-index/chunks.json',
              'data/ai-index/embeddings.bin',
              'data/ai-index/index-meta.json',
              'quality-artifacts/ai-index-maintenance-provider.json',
              'quality-artifacts/ai-index-maintenance-verify.json',
          }

          with zipfile.ZipFile(zip_path) as archive:
              infos = archive.infolist()
              names = [info.filename for info in infos]
              if len(names) != len(expected) or set(names) != expected:
                  raise SystemExit('maintenance archive member allowlist mismatch')
              if sum(info.file_size for info in infos) > max_bytes:
                  raise SystemExit('maintenance archive exceeds bounded uncompressed size')
              for info in infos:
                  path = pathlib.PurePosixPath(info.filename)
                  mode = info.external_attr >> 16
                  if path.is_absolute() or '..' in path.parts or stat.S_ISLNK(mode):
                      raise SystemExit('unsafe maintenance archive member')
                  target = extract_dir / path
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.read(info))
          PY

          PROVIDER="$EXTRACT_DIR/quality-artifacts/ai-index-maintenance-provider.json"
          VERIFY="$EXTRACT_DIR/quality-artifacts/ai-index-maintenance-verify.json"
          CHUNKS="$EXTRACT_DIR/data/ai-index/chunks.json"
          META="$EXTRACT_DIR/data/ai-index/index-meta.json"
          EMBEDDINGS="$EXTRACT_DIR/data/ai-index/embeddings.bin"

          CANDIDATE_SHA="$CANDIDATE_SHA" PROVIDER="$PROVIDER" VERIFY="$VERIFY" CHUNKS="$CHUNKS" META="$META" EMBEDDINGS="$EMBEDDINGS" python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          candidate = os.environ['CANDIDATE_SHA']
          provider = json.loads(pathlib.Path(os.environ['PROVIDER']).read_text())
          verify = json.loads(pathlib.Path(os.environ['VERIFY']).read_text())
          chunks_path = pathlib.Path(os.environ['CHUNKS'])
          meta_path = pathlib.Path(os.environ['META'])
          embeddings_path = pathlib.Path(os.environ['EMBEDDINGS'])
          chunks = json.loads(chunks_path.read_text())
          meta = json.loads(meta_path.read_text())

          def digest(path):
              return 'sha256:' + hashlib.sha256(path.read_bytes()).hexdigest()

          chunk_count = len(chunks) if isinstance(chunks, list) else -1
          chunks_digest = digest(chunks_path)
          embeddings_digest = digest(embeddings_path)
          if chunk_count != 327:
              raise SystemExit('candidate chunk count is outside the reviewed maintenance boundary')
          if meta.get('sourceCommit') != candidate or provider.get('sourceCommit') != candidate or verify.get('sourceCommit') != candidate:
              raise SystemExit('candidate sourceCommit provenance mismatch')
          if meta.get('embeddingModel') != 'openai/text-embedding-3-small' or meta.get('dimensions') != 512:
              raise SystemExit('candidate embedding authority drifted')
          if verify.get('providerAccess') is not False or verify.get('chunkCount') != chunk_count:
              raise SystemExit('offline verification evidence is invalid')
          if verify.get('embeddingModel') != meta.get('embeddingModel') or verify.get('dimensions') != meta.get('dimensions'):
              raise SystemExit('offline verification model/dimensions mismatch')
          if meta.get('corpusDigest') != chunks_digest or verify.get('corpusDigest') != chunks_digest:
              raise SystemExit('candidate corpus digest mismatch')
          if meta.get('embeddingsDigest') != embeddings_digest or verify.get('embeddingsDigest') != embeddings_digest:
              raise SystemExit('candidate embeddings digest mismatch')
          if len(embeddings_path.read_bytes()) != chunk_count * meta['dimensions'] * 4:
              raise SystemExit('candidate Float32 embedding byte length mismatch')

          if provider.get('schemaVersion') != 1 or provider.get('evidenceClass') != 'real-provider-index-maintenance':
              raise SystemExit('provider evidence class is invalid')
          changed = provider.get('changedChunkCount')
          if not isinstance(changed, int) or not 1 <= changed <= 8:
              raise SystemExit('provider changed-chunk budget is invalid')
          candidate_index = provider.get('candidateIndex', {})
          if candidate_index.get('sourceCommit') != candidate or candidate_index.get('chunkCount') != chunk_count:
              raise SystemExit('provider candidate-index provenance mismatch')
          if candidate_index.get('corpusDigest') != chunks_digest or candidate_index.get('embeddingsDigest') != embeddings_digest:
              raise SystemExit('provider candidate-index digest mismatch')
          provider_stats = provider.get('provider', {})
          if provider_stats.get('requestCount') != 1 or provider_stats.get('totalTokens', 0) <= 0 or provider_stats.get('costCredits', 0) <= 0:
              raise SystemExit('provider accounting does not prove one bounded real request')
          key_policy = provider.get('keyPolicy', {})
          if key_policy.get('configuredLimitUsd') != 2 or key_policy.get('lifetimeNoReset') is not True:
              raise SystemExit('provider key-policy evidence is invalid')
          PY

          CHUNKS_SHA="$(sha256sum "$CHUNKS" | awk '{print $1}')"
          META_SHA="$(sha256sum "$META" | awk '{print $1}')"
          EMBEDDINGS_SHA="$(sha256sum "$EMBEDDINGS" | awk '{print $1}')"

          gh api "repos/$GITHUB_REPOSITORY/contents/scripts/ai-index-restore.js?ref=$TRUSTED_SHA" \
            --jq '.content' | tr -d '\n' | base64 --decode > "$RESTORE_PATH"
          CHUNKS_SHA="$CHUNKS_SHA" META_SHA="$META_SHA" EMBEDDINGS_SHA="$EMBEDDINGS_SHA" RESTORE_PATH="$RESTORE_PATH" python3 - <<'PY'
          import os
          import pathlib
          import re

          path = pathlib.Path(os.environ['RESTORE_PATH'])
          source = path.read_text()
          replacements = {
              'chunks.json': os.environ['CHUNKS_SHA'],
              'index-meta.json': os.environ['META_SHA'],
              'embeddings.bin': os.environ['EMBEDDINGS_SHA'],
          }
          for name, digest in replacements.items():
              pattern = rf"('{re.escape(name)}': ')[a-f0-9]{{64}}(')"
              source, count = re.subn(pattern, rf"\g<1>{digest}\g<2>", source)
              if count != 1:
                  raise SystemExit(f'expected exactly one trusted restore digest for {name}, found {count}')
          path.write_text(source)
          PY

          # Re-resolve mutable PR/operator state immediately before any repository write.
          PR_JSON="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          CURRENT_BODY="$(jq -r '.body // ""' <<< "$PR_JSON")"
          CURRENT_COMMAND_LINE="${CURRENT_BODY%%$'\n'*}"
          EXPECTED_COMMAND_LINE="/accept-ai-index $CANDIDATE_SHA $MAINTENANCE_RUN_ID $ARTIFACT_ID $ARTIFACT_DIGEST CONFIRM_AI_INDEX_ARTIFACT_ACCEPTANCE"
          CURRENT_HEAD_SHA="$(jq -r '.head.sha' <<< "$PR_JSON")"
          CURRENT_HEAD_REF="$(jq -r '.head.ref' <<< "$PR_JSON")"
          CURRENT_HEAD_REPO="$(jq -r '.head.repo.full_name' <<< "$PR_JSON")"
          if [ "$(jq -r '.state' <<< "$PR_JSON")" != "open" ] || [ "$CURRENT_HEAD_REPO" != "$GITHUB_REPOSITORY" ] || \
             [ "$CURRENT_HEAD_SHA" != "$CANDIDATE_SHA" ] || [ "$CURRENT_HEAD_REF" != "$HEAD_REF" ]; then
            echo "::error::PR authority changed before repository mutation."
            exit 1
          fi
          if [ "$CURRENT_COMMAND_LINE" != "$EXPECTED_COMMAND_LINE" ]; then
            echo "::error::AI-index acceptance command changed before repository mutation."
            exit 1
          fi

          create_blob() {
            local file="$1"
            base64 -w0 "$file" | jq -Rs '{content: ., encoding: "base64"}' | \
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq '.sha'
          }

          CHUNKS_BLOB="$(create_blob "$CHUNKS")"
          META_BLOB="$(create_blob "$META")"
          EMBEDDINGS_BLOB="$(create_blob "$EMBEDDINGS")"
          RESTORE_BLOB="$(create_blob "$RESTORE_PATH")"
          BASE_TREE="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$CANDIDATE_SHA" --jq '.tree.sha')"

          TREE_SHA="$(jq -n \
            --arg base "$BASE_TREE" \
            --arg chunks "$CHUNKS_BLOB" \
            --arg meta "$META_BLOB" \
            --arg embeddings "$EMBEDDINGS_BLOB" \
            --arg restore "$RESTORE_BLOB" \
            '{base_tree:$base,tree:[
              {path:"data/ai-index-accepted/ai5/chunks.json",mode:"100644",type:"blob",sha:$chunks},
              {path:"data/ai-index-accepted/ai5/index-meta.json",mode:"100644",type:"blob",sha:$meta},
              {path:"data/ai-index-accepted/ai5/embeddings.bin",mode:"100644",type:"blob",sha:$embeddings},
              {path:"scripts/ai-index-restore.js",mode:"100644",type:"blob",sha:$restore}
            ]}' | gh api --method POST "repos/$GITHUB_REPOSITORY/git/trees" --input - --jq '.sha')"

          COMMIT_SHA="$(jq -n --arg tree "$TREE_SHA" --arg parent "$CANDIDATE_SHA" \
            --arg message "chore: accept verified AI index for $CANDIDATE_SHA" \
            '{message:$message,tree:$tree,parents:[$parent]}' | \
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/commits" --input - --jq '.sha')"

          # Final revocation/head check before the only reachable mutation: branch fast-forward.
          FINAL_PR_JSON="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          FINAL_BODY="$(jq -r '.body // ""' <<< "$FINAL_PR_JSON")"
          FINAL_COMMAND_LINE="${FINAL_BODY%%$'\n'*}"
          FINAL_HEAD_SHA="$(jq -r '.head.sha' <<< "$FINAL_PR_JSON")"
          FINAL_HEAD_REF="$(jq -r '.head.ref' <<< "$FINAL_PR_JSON")"
          if [ "$FINAL_HEAD_SHA" != "$CANDIDATE_SHA" ] || [ "$FINAL_HEAD_REF" != "$HEAD_REF" ] || \
             [ "$FINAL_COMMAND_LINE" != "$EXPECTED_COMMAND_LINE" ]; then
            echo "::error::PR head or operator acceptance changed before branch mutation."
            exit 1
          fi
          REF_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$HEAD_REF" --jq '.object.sha')"
          if [ "$REF_SHA" != "$CANDIDATE_SHA" ]; then
            echo "::error::PR branch ref moved before atomic acceptance."
            exit 1
          fi

          jq -n --arg sha "$COMMIT_SHA" '{sha:$sha,force:false}' | \
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$HEAD_REF" --input - >/dev/null
          echo "Accepted reviewed AI-index artifact as atomic commit $COMMIT_SHA"
