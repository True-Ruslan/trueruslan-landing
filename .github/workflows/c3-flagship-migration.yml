name: C3 flagship source migration

on:
  push:
    branches:
      - feat/portfolio-clarity-c3-projects
    paths:
      - scripts/c3-source-migration.mjs
      - .github/workflows/c3-flagship-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout C3 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/portfolio-clarity-c3-projects

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Repair migration row representation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/c3-source-migration.mjs')
          s = p.read_text()
          old = '''  const rows = [
              ...fields.map(([term, value]) => `<dt>${term}</dt>\\n<dd>${value}</dd>`),
              [`${statusTerm}`, `<span data-tr-project-status="${slug}"></span>`],
            ];'''.replace('            ', '')
          new = '''  const rows = [
            ...fields,
            [statusTerm, `<span data-tr-project-status="${slug}"></span>`],
          ];'''.replace('          ', '')
          if old not in s:
              raise SystemExit('Expected migration row block not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Apply C3 source migration
        run: node scripts/c3-source-migration.mjs

      - name: Verify focused C3 contract
        run: node --test scripts/portfolio-clarity-c3.test.js

      - name: Commit migrated source and remove temporary migration files
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/c3-source-migration.mjs .github/workflows/c3-flagship-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/landing/projects docs/en/projects docs/_assets/style/custom.css scripts/c3-source-migration.mjs .github/workflows/c3-flagship-migration.yml
          git diff --cached --check
          git commit -m 'feat: add C3 flagship summary layer'
          git push origin HEAD:feat/portfolio-clarity-c3-projects
