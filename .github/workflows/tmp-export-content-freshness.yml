name: Temporary content freshness reconciliation

on:
  push:
    branches:
      - maintenance/content-freshness-2026-08-14

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Apply bounded freshness reconciliation
        run: python3 scripts/tmp-content-freshness-reconcile.py

      - name: Remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-export-content-freshness.yml scripts/tmp-content-freshness-reconcile.py
          git diff --check
          git status --short

      - name: Commit reconciled evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/project-evidence.json data/project-history/livingworld.json data/project-history/vlezet.json data/project-history/portfolio-platform.json
          git commit -m 'docs: reconcile project freshness evidence'
          git push origin HEAD:maintenance/content-freshness-2026-08-14
