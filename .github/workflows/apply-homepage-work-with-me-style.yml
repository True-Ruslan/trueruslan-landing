name: Apply homepage work-with-me style

on:
  push:
    branches:
      - fix/homepage-work-with-me-style

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
      - name: Apply style migration
        run: node .github/scripts/apply-home-collaboration-style.cjs
      - name: Install dependencies
        run: npm ci
      - name: Verify focused homepage tests
        run: node --test scripts/standalone-home.test.js
      - name: Commit migration and remove helper
        shell: bash
        run: |
          rm .github/scripts/apply-home-collaboration-style.cjs
          rm .github/workflows/apply-homepage-work-with-me-style.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/standalone-home.js scripts/standalone-home.test.js docs/_assets/style/collaboration.css .github/scripts/apply-home-collaboration-style.cjs .github/workflows/apply-homepage-work-with-me-style.yml
          git commit -m "fix: align homepage work-with-me section"
          git push origin HEAD:fix/homepage-work-with-me-style
