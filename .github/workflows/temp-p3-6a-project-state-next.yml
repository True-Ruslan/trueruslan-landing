name: Temporary P3.6A PROJECT_STATE correction

on:
  push:
    branches:
      - docs/p3-6a-readiness-acceptance

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/p3-6a-readiness-acceptance
          persist-credentials: true
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Apply targeted PROJECT_STATE correction
        run: node scripts/temp-p3-6a-project-state-next.cjs
      - name: Verify patch
        run: |
          git diff --check
          git diff -- docs/PROJECT_STATE.md
      - name: Commit corrected durable state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT_STATE.md
          git diff --cached --quiet && { echo "Expected PROJECT_STATE correction produced no changes" >&2; exit 1; }
          git commit -m "docs: advance next slice to P3.6 measurement"
          git push origin HEAD:docs/p3-6a-readiness-acceptance
