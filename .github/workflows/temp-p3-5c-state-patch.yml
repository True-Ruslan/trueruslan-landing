name: Temporary P3.5C state patch

on:
  push:
    branches:
      - docs/p3-5c-production-acceptance

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/p3-5c-production-acceptance
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic P3.5C durable-state patch
        run: node scripts/temp-p3-5c-state-patch.cjs
      - name: Verify patch
        run: |
          git diff --check
          git status --short
      - name: Commit durable state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT_STATE.md docs/ROADMAP.md docs/CHANGELOG.md docs/keystone/specs/2026-08-05-portfolio-1-0-evidence-first.md
          git diff --cached --quiet && exit 1
          git commit -m "docs: close P3.5C production acceptance"
          git push origin HEAD:docs/p3-5c-production-acceptance
