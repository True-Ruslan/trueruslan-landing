name: Content Freshness

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      max_age_days:
        description: Maximum age of lastVerified before a maintenance finding
        required: false
        default: '30'
  push:
    branches:
      - master
    paths:
      - '.github/workflows/content-freshness.yml'
      - 'data/projects.json'
      - 'data/project-evidence.json'
      - 'data/project-history/**'
      - 'scripts/content-freshness*.js'
  pull_request:
    paths:
      - '.github/workflows/content-freshness.yml'
      - 'data/projects.json'
      - 'data/project-evidence.json'
      - 'data/project-history/**'
      - 'scripts/content-freshness*.js'

permissions:
  contents: read
  issues: write

concurrency:
  group: content-freshness-guard-${{ github.event.pull_request.number || 'maintenance' }}
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Collect bounded external observations
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/content-freshness-probe.js
          --output quality-artifacts/content-freshness-observations.json

      - name: Build deterministic freshness report
        shell: bash
        run: |
          MAX_AGE_DAYS="${{ github.event.inputs.max_age_days || '30' }}"
          node scripts/content-freshness-report.js \
            --observations quality-artifacts/content-freshness-observations.json \
            --output-dir quality-artifacts \
            --max-age-days "$MAX_AGE_DAYS"

      - name: Upload freshness evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: content-freshness-report
          path: |
            quality-artifacts/content-freshness-observations.json
            quality-artifacts/content-freshness-report.json
            quality-artifacts/content-freshness-report.md
          if-no-files-found: error
          retention-days: 30

      - name: Create, update or close freshness issue
        if: github.event_name != 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- content-freshness-guard -->';
            const report = JSON.parse(fs.readFileSync('quality-artifacts/content-freshness-report.json', 'utf8'));
            const markdown = fs.readFileSync('quality-artifacts/content-freshness-report.md', 'utf8').trim();
            const {owner, repo} = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'all',
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && (issue.body || '').includes(marker));
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = `${markdown}\n\nWorkflow run: ${runUrl}\n`;

            if (report.summary.total > 0) {
              if (existing) {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: existing.number,
                  title: 'Content Freshness Guard findings',
                  body,
                  state: 'open',
                });
              } else {
                await github.rest.issues.create({
                  owner,
                  repo,
                  title: 'Content Freshness Guard findings',
                  body,
                });
              }
              return;
            }

            if (existing?.state === 'open') {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                title: 'Content Freshness Guard — clean',
                body,
                state: 'closed',
                state_reason: 'completed',
              });
            }
