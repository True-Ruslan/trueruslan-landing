name: Production Live Smoke

on:
  push:
    branches:
      - master
  schedule:
    - cron: '53 7 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/production-live.yml'
      - 'scripts/production-live-smoke.cjs'
      - 'scripts/production-live-workflow.test.js'

permissions:
  contents: read
  pages: read
  actions: read

concurrency:
  group: production-live-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Resolve deployed Pages build
        id: pages
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GITHUB_SHA: ${{ github.sha }}
          PUSH_EVENT: ${{ github.event_name == 'push' }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const isPush = process.env.PUSH_EVENT === 'true';
            const expected = process.env.GITHUB_SHA;
            const attempts = isPush ? 80 : 40;
            let deployed = null;

            for (let attempt = 1; attempt <= attempts; attempt += 1) {
              const response = await github.request('GET /repos/{owner}/{repo}/actions/runs', {
                owner,
                repo,
                branch: 'master',
                event: 'push',
                per_page: 100,
              });
              const pageRuns = response.data.workflow_runs.filter((run) => {
                const path = run.path || '';
                const name = (run.name || '').toLowerCase();
                return path.includes('pages-build-deployment')
                  || name.includes('pages build and deployment')
                  || name.includes('pages-build-deployment');
              });
              deployed = isPush
                ? pageRuns.find((run) => run.head_sha === expected && run.status === 'completed')
                : pageRuns.find((run) => run.status === 'completed' && run.conclusion === 'success');

              const newest = pageRuns[0];
              core.info(`Pages Actions attempt ${attempt}/${attempts}: newest=${newest?.head_sha || 'none'} ${newest?.status || 'unknown'}/${newest?.conclusion || 'unknown'}`);

              if (deployed?.conclusion === 'success') break;
              if (deployed && deployed.conclusion !== 'success') {
                core.setFailed(`Pages deployment run ${deployed.id} for ${deployed.head_sha} concluded ${deployed.conclusion}.`);
                return;
              }
              if (attempt === attempts) {
                const target = isPush ? `exact pushed SHA ${expected}` : 'latest successful deployment';
                core.setFailed(`Timed out waiting for ${target} in pages-build-deployment Actions runs.`);
                return;
              }
              await new Promise((resolve) => setTimeout(resolve, 15000));
            }

            core.setOutput('deployed_sha', deployed.head_sha);
            core.setOutput('pages_status', `${deployed.status}/${deployed.conclusion}`);
            core.setOutput('pages_build_id', String(deployed.id));
            core.setOutput('pages_created_at', deployed.created_at || '');
            core.setOutput('pages_updated_at', deployed.updated_at || '');
            core.setOutput('pages_run_url', deployed.html_url || '');

      - name: Install pinned browser quality tool
        run: npm install --prefix .quality-tools --package-lock=false --no-save playwright@1.61.1

      - name: Install Chromium
        run: node .quality-tools/node_modules/playwright/cli.js install --with-deps chromium

      - name: Run deployed production smoke
        env:
          EXPECTED_DEPLOYED_SHA: ${{ steps.pages.outputs.deployed_sha }}
          PAGES_STATUS: ${{ steps.pages.outputs.pages_status }}
          PAGES_BUILD_ID: ${{ steps.pages.outputs.pages_build_id }}
          PAGES_CREATED_AT: ${{ steps.pages.outputs.pages_created_at }}
          PAGES_UPDATED_AT: ${{ steps.pages.outputs.pages_updated_at }}
          PAGES_RUN_URL: ${{ steps.pages.outputs.pages_run_url }}
        run: node scripts/production-live-smoke.cjs

      - name: Preserve Pages deployment identity
        if: always()
        shell: bash
        run: |
          mkdir -p production-artifacts
          cat > production-artifacts/pages-build.json <<'JSON'
          {
            "deployedSha": "${{ steps.pages.outputs.deployed_sha }}",
            "status": "${{ steps.pages.outputs.pages_status }}",
            "buildId": "${{ steps.pages.outputs.pages_build_id }}",
            "runUrl": "${{ steps.pages.outputs.pages_run_url }}",
            "createdAt": "${{ steps.pages.outputs.pages_created_at }}",
            "updatedAt": "${{ steps.pages.outputs.pages_updated_at }}",
            "trigger": "${{ github.event_name }}",
            "callerSha": "${{ github.sha }}"
          }
          JSON

      - name: Upload production live evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-live-evidence
          path: production-artifacts
          if-no-files-found: error
          retention-days: 30
