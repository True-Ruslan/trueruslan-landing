name: Production Live Smoke

on:
  push:
    branches:
      - master
  workflow_run:
    workflows:
      - 'Deploy static content to Pages'
    types:
      - completed
    branches:
      - master
  schedule:
    - cron: '53 7 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/production-live.yml'
      - 'scripts/production-live-smoke.cjs'
      - 'scripts/production-live-routes.cjs'
      - 'scripts/production-live-routes.test.js'
      - 'scripts/production-live-workflow.test.js'
      - 'scripts/production-yandex-metrica-consent-smoke.cjs'
      - 'scripts/production-yandex-metrica-consent-workflow.test.js'
      - 'scripts/production-portfolio-platform-smoke.cjs'
      - 'scripts/production-flagship-normalization-smoke.cjs'
      - 'scripts/production-p3-5b-english-now-smoke.cjs'
      - 'scripts/production-p3-5c-english-publications-smoke.cjs'
      - 'scripts/production-work-with-me-smoke.cjs'
      - 'scripts/production-work-with-me-workflow.test.js'
      - 'scripts/production-deployment-verification-note-smoke.cjs'
      - 'scripts/production-clean-urls-note-smoke.cjs'
      - 'scripts/production-hybrid-recognition-note-smoke.cjs'
      - 'scripts/production-gametests-installed-acceptance-note-smoke.cjs'
      - 'scripts/production-passive-pdf-semantic-completeness-note-smoke.cjs'
      - 'scripts/production-evidence-driven-project-state-note-smoke.cjs'
      - 'scripts/production-favicon-smoke.cjs'
      - 'scripts/production-favicon-workflow.test.js'

permissions:
  contents: read
  pages: read
  deployments: read

concurrency:
  group: production-live-${{ github.event_name }}-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Resolve deployed Pages build
        id: pages
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          EXACT_DEPLOYMENT: ${{ github.event_name == 'push' || github.event_name == 'workflow_run' }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion || '' }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const exactDeployment = process.env.EXACT_DEPLOYMENT === 'true';
            const expected = process.env.EXPECTED_SHA;
            const workflowRunConclusion = process.env.WORKFLOW_RUN_CONCLUSION;
            const attempts = exactDeployment ? 80 : 40;
            let deployed = null;
            let deployedStatus = null;

            if (context.eventName === 'workflow_run' && workflowRunConclusion !== 'success') {
              core.setFailed(`Source Pages workflow concluded ${workflowRunConclusion || 'unknown'} for ${expected}.`);
              return;
            }

            async function latestStatus(deployment) {
              const response = await github.request('GET /repos/{owner}/{repo}/deployments/{deployment_id}/statuses', {
                owner,
                repo,
                deployment_id: deployment.id,
                per_page: 100,
              });
              return response.data[0] || null;
            }

            for (let attempt = 1; attempt <= attempts; attempt += 1) {
              const response = await github.request('GET /repos/{owner}/{repo}/deployments', {
                owner,
                repo,
                environment: 'github-pages',
                per_page: 100,
              });
              const deployments = response.data;
              const candidates = exactDeployment
                ? deployments.filter((deployment) => deployment.sha === expected)
                : deployments;

              deployed = null;
              deployedStatus = null;
              for (const deployment of candidates.slice(0, 20)) {
                const status = await latestStatus(deployment);
                if (status?.state === 'success') {
                  deployed = deployment;
                  deployedStatus = status;
                  break;
                }
                if (exactDeployment && ['error', 'failure'].includes(status?.state)) {
                  core.setFailed(`github-pages deployment ${deployment.id} for ${deployment.sha} concluded ${status.state}.`);
                  return;
                }
              }

              const newest = deployments[0];
              const newestStatus = newest ? await latestStatus(newest) : null;
              core.info(`Deployment attempt ${attempt}/${attempts}: expected=${expected}, newest=${newest?.sha || 'none'}, state=${newestStatus?.state || 'unknown'}`);

              if (deployed && deployedStatus) break;
              if (attempt === attempts) {
                const target = exactDeployment
                  ? `exact deployed SHA ${expected}`
                  : 'latest successful github-pages deployment';
                core.setFailed(`Timed out waiting for ${target}.`);
                return;
              }
              await new Promise((resolve) => setTimeout(resolve, 15000));
            }

            core.setOutput('deployed_sha', deployed.sha);
            core.setOutput('pages_status', deployedStatus.state);
            core.setOutput('pages_build_id', String(deployed.id));
            core.setOutput('pages_created_at', deployed.created_at || '');
            core.setOutput('pages_updated_at', deployed.updated_at || '');
            core.setOutput('pages_run_url', deployedStatus.environment_url || deployedStatus.target_url || deployed.url || '');

      - name: Install pinned browser quality tool
        run: npm install --prefix .quality-tools --package-lock=false --no-save playwright@1.61.1

      - name: Install Chromium
        run: node .quality-tools/node_modules/playwright/cli.js install --with-deps chromium

      - name: Run deployed production smoke
        env:
          EXPECTED_DEPLOYED_SHA: ${{ steps.pages.outputs.deployed_sha }}
          EXPECT_PROJECTED_PUBLIC_ROUTES: ${{ github.event_name != 'pull_request' }}
          PAGES_STATUS: ${{ steps.pages.outputs.pages_status }}
          PAGES_BUILD_ID: ${{ steps.pages.outputs.pages_build_id }}
          PAGES_CREATED_AT: ${{ steps.pages.outputs.pages_created_at }}
          PAGES_UPDATED_AT: ${{ steps.pages.outputs.pages_updated_at }}
          PAGES_RUN_URL: ${{ steps.pages.outputs.pages_run_url }}
        run: node scripts/production-live-smoke.cjs

      - name: Run deployed Yandex Metrica pre-consent smoke
        if: github.event_name != 'pull_request'
        env:
          EXPECTED_DEPLOYED_SHA: ${{ steps.pages.outputs.deployed_sha }}
        run: node scripts/production-yandex-metrica-consent-smoke.cjs

      - name: Run deployed portfolio platform smoke
        if: github.event_name != 'pull_request'
        env:
          EXPECTED_DEPLOYED_SHA: ${{ steps.pages.outputs.deployed_sha }}
        run: node scripts/production-portfolio-platform-smoke.cjs

      - name: Run deployed flagship normalization smoke
        if: github.event_name != 'pull_request'
        env:
          EXPECTED_DEPLOYED_SHA: ${{ steps.pages.outputs.deployed_sha }}
        run: node scripts/production-flagship-normalization-smoke.cjs

      - name: Run deployed P3.5B English Now smoke
        if: github.event_name != 'pull_request'
        env:
          EXPECTED_DEPLOYED_SHA: ${{ steps.pages.outputs.deployed_sha }}
        run: node scripts/production-p3-5b-english-now-smoke.cjs

      - name: Run deployed P3.5C English Publications smoke
        if: github.event_name != 'pull_request'
        env:
          EXPECTED_DEPLOYED_SHA: ${{ steps.pages.outputs.deployed_sha }}
        run: node scripts/production-p3-5c-english-publications-smoke.cjs

      - name: Run deployed Work with me smoke
        if: github.event_name != 'pull_request'
        env:
          EXPECTED_DEPLOYED_SHA: ${{ steps.pages.outputs.deployed_sha }}
        run: node scripts/production-work-with-me-smoke.cjs

      - name: Run deployed P3.4A Note smoke
        if: github.event_name != 'pull_request'
        env:
          EXPECTED_DEPLOYED_SHA: ${{ steps.pages.outputs.deployed_sha }}
        run: node scripts/production-deployment-verification-note-smoke.cjs

      - name: Run deployed P3.4B Clean URLs Note smoke
        if: github.event_name != 'pull_request'
        env:
          EXPECTED_DEPLOYED_SHA: ${{ steps.pages.outputs.deployed_sha }}
        run: node scripts/production-clean-urls-note-smoke.cjs

      - name: Run deployed P3.4C Hybrid Recognition Note smoke
        if: github.event_name != 'pull_request'
        env:
          EXPECTED_DEPLOYED_SHA: ${{ steps.pages.outputs.deployed_sha }}
        run: node scripts/production-hybrid-recognition-note-smoke.cjs

      - name: Run deployed P3.4D GameTests Acceptance Note smoke
        if: github.event_name != 'pull_request'
        env:
          EXPECTED_DEPLOYED_SHA: ${{ steps.pages.outputs.deployed_sha }}
        run: node scripts/production-gametests-installed-acceptance-note-smoke.cjs

      - name: Run deployed P3.4E Passive PDF Completeness Note smoke
        if: github.event_name != 'pull_request'
        env:
          EXPECTED_DEPLOYED_SHA: ${{ steps.pages.outputs.deployed_sha }}
        run: node scripts/production-passive-pdf-semantic-completeness-note-smoke.cjs

      - name: Run deployed P3.4F Evidence-Driven Project State Note smoke
        if: github.event_name != 'pull_request'
        env:
          EXPECTED_DEPLOYED_SHA: ${{ steps.pages.outputs.deployed_sha }}
        run: node scripts/production-evidence-driven-project-state-note-smoke.cjs

      - name: Run deployed favicon smoke
        if: github.event_name != 'pull_request'
        env:
          EXPECTED_DEPLOYED_SHA: ${{ steps.pages.outputs.deployed_sha }}
        run: node scripts/production-favicon-smoke.cjs

      - name: Preserve Pages deployment identity
        if: always()
        shell: bash
        run: |
          mkdir -p production-artifacts
          cat > production-artifacts/pages-build.json <<'JSON'
          {
            "deployedSha": "${{ steps.pages.outputs.deployed_sha }}",
            "status": "${{ steps.pages.outputs.pages_status }}",
            "buildId": "${{ steps.pages.outputs.pages_build_id }}",
            "runUrl": "${{ steps.pages.outputs.pages_run_url }}",
            "createdAt": "${{ steps.pages.outputs.pages_created_at }}",
            "updatedAt": "${{ steps.pages.outputs.pages_updated_at }}",
            "trigger": "${{ github.event_name }}",
            "callerSha": "${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}",
            "sourceWorkflowRunId": "${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}",
            "sourceWorkflowConclusion": "${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion || '' }}"
          }
          JSON

      - name: Upload production live evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-live-evidence
          path: production-artifacts
          if-no-files-found: error
          retention-days: 30
