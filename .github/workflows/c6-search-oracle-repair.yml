name: C6 search oracle repair
# Registered-trigger commit for metadata diff cleanup.

on:
  push:
    branches:
      - feat/portfolio-clarity-c6-en-seo
    paths:
      - .github/workflows/c6-search-oracle-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/portfolio-clarity-c6-en-seo
          fetch-depth: 0

      - name: Restore base page-meta formatting and keep four C6 values
        run: |
          set -euo pipefail
          git show 8335e0f0fda66691536df9aa501c81ceff7cb0f6:data/page-meta.json > /tmp/page-meta.json
          python3 - <<'PY'
          from pathlib import Path
          source = Path('/tmp/page-meta.json').read_text(encoding='utf-8')

          replacements = [
              ('"title": "Ruslan Nemykin — Backend Engineer"', '"title": "Ruslan Nemykin — Java Backend Engineer"'),
              ('"title": "Resume — Ruslan Nemykin"', '"title": "Experience — Ruslan Nemykin"'),
              ('"displayTitle": "ENGINEERING RESUME"', '"displayTitle": "ENGINEERING EXPERIENCE"'),
          ]
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f'expected exactly one metadata marker {old!r}, found {source.count(old)}')
              source = source.replace(old, new, 1)

          marker = '''    "path": "en/index.html",
    "card": "home-en",
    "title": "Ruslan Nemykin — Java Backend Engineer",
    "description": "Engineering portfolio of Ruslan Nemykin: Java backend, distributed systems, DevOps, AI engineering, projects and technical notes.",
    "displayTitle": "RUSLAN NEMYKIN",
    "kicker": "BACKEND ENGINEER",'''
          replacement = marker.replace('"kicker": "BACKEND ENGINEER"', '"kicker": "JAVA BACKEND ENGINEER"')
          if source.count(marker) != 1:
              raise SystemExit(f'expected exactly one EN home kicker block, found {source.count(marker)}')
          source = source.replace(marker, replacement, 1)

          Path('data/page-meta.json').write_text(source, encoding='utf-8')
          PY
          git diff --check

      - name: Commit metadata cleanup only
        run: |
          set -euo pipefail
          git add data/page-meta.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove non-C6 page-meta formatting noise'
          git push origin HEAD:feat/portfolio-clarity-c6-en-seo
