name: C6 search oracle repair

on:
  push:
    branches:
      - feat/portfolio-clarity-c6-en-seo
    paths:
      - .github/workflows/c6-search-oracle-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/portfolio-clarity-c6-en-seo
          fetch-depth: 0

      - name: Restore exact pre-regression smoke and change only EN Now oracle
        run: |
          set -euo pipefail
          git show 5cc8c9a8d22c8805162a1605ba4ac4e637cbee61:scripts/search-smoke.cjs > /tmp/search-smoke.cjs
          python3 - <<'PY'
          from pathlib import Path
          original = Path('/tmp/search-smoke.cjs').read_text(encoding='utf-8')
          updated = original
          old_query = "const query = 'current engineering focus';"
          old_phrase = "const hasPhrase = body.includes('current engineering focus');"
          if updated.count(old_query) != 1:
              raise SystemExit(f'expected one old EN Now query, found {updated.count(old_query)}')
          if updated.count(old_phrase) != 1:
              raise SystemExit(f'expected one old EN Now phrase check, found {updated.count(old_phrase)}')
          updated = updated.replace(old_query, "const query = 'short snapshot';", 1)
          updated = updated.replace(old_phrase, "const hasPhrase = body.includes('short snapshot');", 1)
          Path('scripts/search-smoke.cjs').write_text(updated, encoding='utf-8')

          old_lines = original.splitlines()
          new_lines = updated.splitlines()
          changed = [(i + 1, old, new) for i, (old, new) in enumerate(zip(old_lines, new_lines)) if old != new]
          if len(changed) != 2:
              raise SystemExit(f'expected exactly two changed lines, got {len(changed)}: {changed}')
          print('Exact two-line search oracle repair:', changed)
          PY
          git diff --check

      - name: Commit only repaired search oracle
        run: |
          set -euo pipefail
          git add scripts/search-smoke.cjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: reconcile EN Now search oracle with C6 copy'
          git push origin HEAD:feat/portfolio-clarity-c6-en-seo
