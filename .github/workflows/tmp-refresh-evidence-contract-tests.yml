name: Temporary evidence contract test refresh

on:
  push:
    branches:
      - maintenance/content-freshness-2026-08-14

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Refresh evidence contract tests
        run: python3 scripts/tmp-refresh-evidence-contract-tests.py

      - name: Remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-refresh-evidence-contract-tests.yml scripts/tmp-refresh-evidence-contract-tests.py
          git diff --check
          git status --short

      - name: Commit refreshed contracts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/content-freshness-reconciliation-2026-08-11.test.js \
            scripts/current-project-evidence-state.test.js \
            scripts/flagship-normalization.test.js \
            scripts/portfolio-platform-case-study.test.js \
            scripts/product-evidence-reconciliation.test.js \
            scripts/villaigence-flagship.test.js \
            scripts/vlezet-draft-drift.test.js
          git commit -m 'test: align project evidence contracts with current truth'
          git push origin HEAD:maintenance/content-freshness-2026-08-14
