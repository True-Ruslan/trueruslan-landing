name: Deploy static content to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:
    inputs:
      analytics_mode:
        description: Analytics deployment mode
        required: true
        default: auto
        type: choice
        options:
          - auto
          - required
          - disabled

env:
  SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Resolve analytics deployment contract
        env:
          ANALYTICS_DEPLOYMENT_MODE: ${{ inputs.analytics_mode || 'auto' }}
          ANALYTICS_SITE_TOKEN: ${{ vars.TR_CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
        run: node scripts/analytics-deployment.js
      - name: Build docs
        run: npm run build:docs
      - name: Check generated site integrity
        run: npm run check:site
      - name: Verify generated analytics state
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {verifyAnalyticsArtifact} from './scripts/analytics-deployment.js';
          const result = verifyAnalyticsArtifact('docs-html', {
            expectation: process.env.ANALYTICS_EXPECTATION,
            token: process.env.TR_CLOUDFLARE_WEB_ANALYTICS_TOKEN,
          });
          console.log(JSON.stringify(result, null, 2));
          if (!result.ok) process.exit(1);
          NODE
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs-html'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test deployed Pages site
        env:
          PRODUCTION_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3 4 5; do
            echo "Production smoke attempt ${attempt}: ${PRODUCTION_URL}"
            if node scripts/production-smoke.js "${PRODUCTION_URL}"; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
      - name: Upload production verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-verification-reports
          path: |
            production-smoke-report.json
            analytics-deployment-contract.json
          if-no-files-found: warn
          retention-days: 14
