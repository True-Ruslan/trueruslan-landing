name: Deploy static content to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:
    inputs:
      site_mode:
        description: Production site deployment mode
        required: true
        default: auto
        type: choice
        options:
          - auto
          - legacy
          - custom
      analytics_mode:
        description: Analytics deployment mode
        required: true
        default: auto
        type: choice
        options:
          - auto
          - required
          - disabled

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Resolve site deployment contract
        env:
          SITE_DEPLOYMENT_MODE: ${{ inputs.site_mode || 'auto' }}
          TR_PRODUCTION_SITE_URL: ${{ vars.TR_PRODUCTION_SITE_URL }}
        run: node scripts/site-deployment.js
      - name: Resolve analytics deployment contract
        env:
          ANALYTICS_DEPLOYMENT_MODE: ${{ inputs.analytics_mode || 'auto' }}
          ANALYTICS_SITE_TOKEN: ${{ vars.TR_CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
        run: node scripts/analytics-deployment.js
      - name: Build docs
        run: npm run build:docs
      - name: Check generated site integrity
        run: npm run check:site
      - name: Verify generated analytics state
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {verifyAnalyticsArtifact} from './scripts/analytics-deployment.js';
          const result = verifyAnalyticsArtifact('docs-html', {
            expectation: process.env.ANALYTICS_EXPECTATION,
            token: process.env.TR_CLOUDFLARE_WEB_ANALYTICS_TOKEN,
          });
          console.log(JSON.stringify(result, null, 2));
          if (!result.ok) process.exit(1);
          NODE
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: './docs-html'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
      - name: Smoke test deployed Pages site
        env:
          DEPLOYED_PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3 4 5; do
            echo "Production smoke attempt ${attempt}: transport=${DEPLOYED_PAGE_URL} expected=${SITE_URL}"
            if EXPECTED_SITE_ORIGIN="${SITE_URL}" node scripts/production-smoke.js "${DEPLOYED_PAGE_URL}"; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
      - name: Upload production verification reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-verification-reports
          path: |
            production-smoke-report.json
            site-deployment-contract.json
            analytics-deployment-contract.json
          if-no-files-found: warn
          retention-days: 14
