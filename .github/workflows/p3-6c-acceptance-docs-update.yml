name: P3.6C Acceptance Docs Update

on:
  push:
    branches:
      - docs/p3-6c-production-acceptance
    paths:
      - .github/workflows/p3-6c-acceptance-docs-update.yml
      - scripts/apply-p3-6c-acceptance-docs.js

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout acceptance branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/p3-6c-production-acceptance
          fetch-depth: 1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Apply exact production acceptance evidence
        run: node scripts/apply-p3-6c-acceptance-docs.js
      - name: Verify mutation scope
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf '%s\n' \
            docs/CHANGELOG.md \
            docs/PROJECT_STATE.md \
            docs/ROADMAP.md \
            docs/keystone/specs/2026-08-07-p3-6c-consent-gated-metrica.md | sort)"
          actual="$(git diff --name-only | sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo "Unexpected mutation scope."
            echo "Expected:"
            printf '%s\n' "$expected"
            echo "Actual:"
            printf '%s\n' "$actual"
            exit 1
          fi
      - name: Commit exact production acceptance evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/CHANGELOG.md \
            docs/PROJECT_STATE.md \
            docs/ROADMAP.md \
            docs/keystone/specs/2026-08-07-p3-6c-consent-gated-metrica.md
          git commit -m 'docs: record P3.6C exact production acceptance'
          git push origin HEAD:docs/p3-6c-production-acceptance
