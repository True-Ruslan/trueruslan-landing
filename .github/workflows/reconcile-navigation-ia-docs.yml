name: Reconcile Navigation IA Docs

on:
  push:
    branches:
      - docs/reconcile-navigation-ia-production
    paths:
      - .github/workflows/reconcile-navigation-ia-docs.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/reconcile-navigation-ia-production
          fetch-depth: 1
      - name: Reconcile durable state
        run: |
          python3 scripts/reconcile-navigation-ia-docs.py
          git diff --check
          git diff -- docs/PROJECT_STATE.md docs/ROADMAP.md docs/CHANGELOG.md
      - name: Commit reconciliation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PROJECT_STATE.md docs/ROADMAP.md docs/CHANGELOG.md
          git commit -m 'docs: apply navigation IA production reconciliation'
          git push origin HEAD:docs/reconcile-navigation-ia-production
