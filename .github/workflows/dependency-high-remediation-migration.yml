name: Dependency high remediation migration

on:
  push:
    branches:
      - fix/dependency-high-advisories-2026-08-10
    paths:
      - 'package.json'
      - '.github/workflows/dependency-high-remediation-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/dependency-high-advisories-2026-08-10
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Regenerate lockfile from explicit patch overrides
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify clean install and focused dependency contracts
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --test scripts/dependency-security.test.js
      - name: Verify audit has no high or critical findings
        shell: bash
        run: |
          set -euo pipefail
          npm audit --json > dependency-audit-after.json || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const audit = JSON.parse(fs.readFileSync('dependency-audit-after.json', 'utf8'));
          const counts = audit.metadata?.vulnerabilities ?? {};
          if ((counts.high ?? 0) !== 0 || (counts.critical ?? 0) !== 0) {
            console.error(`Expected zero high/critical findings, got high=${counts.high ?? 0}, critical=${counts.critical ?? 0}`);
            process.exit(1);
          }
          console.log(JSON.stringify(counts));
          NODE
      - name: Commit regenerated lockfile and remove migration workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/dependency-high-remediation-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json .github/workflows/dependency-high-remediation-migration.yml
          git diff --cached --check
          git commit -m 'fix: regenerate lockfile with patched dependency releases'
          git push origin HEAD:fix/dependency-high-advisories-2026-08-10
