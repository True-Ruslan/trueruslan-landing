name: Temporary canonical CV patch

on:
  push:
    branches:
      - docs/publish-canonical-site-links

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/publish-canonical-site-links
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF editor
        run: python -m pip install --disable-pip-version-check 'PyMuPDF==1.26.3'
      - name: Patch URI annotations and prove zero visual change
        shell: bash
        run: |
          cp docs/assets/documents/cv.pdf /tmp/cv-before.pdf
          python - <<'PY'
          from pathlib import Path
          import fitz

          pdf_path = Path('docs/assets/documents/cv.pdf')
          legacy = 'https://true-ruslan.github.io/trueruslan-landing/'
          canonical = 'https://trueruslan.ru/'
          tmp_path = pdf_path.with_suffix('.canonical.tmp.pdf')

          doc = fitz.open(pdf_path)
          updated = 0
          for page in doc:
              for link in page.get_links():
                  if link.get('uri') != legacy:
                      continue
                  link['uri'] = canonical
                  page.update_link(link)
                  updated += 1
          if updated != 3:
              raise SystemExit(f'Expected exactly three legacy URI annotations, updated {updated}')
          doc.save(tmp_path, garbage=4, deflate=True, clean=True)
          doc.close()
          tmp_path.replace(pdf_path)

          with fitz.open(pdf_path) as result:
              uris = [
                  link.get('uri')
                  for page in result
                  for link in page.get_links()
                  if link.get('uri')
              ]
          if uris.count(canonical) != 3:
              raise SystemExit(f'Expected three canonical annotations, got {uris.count(canonical)}')
          if legacy in uris:
              raise SystemExit('Legacy URI remains in PDF annotations')

          def render_bytes(path):
              pages = []
              with fitz.open(path) as document:
                  for page in document:
                      pix = page.get_pixmap(dpi=200, alpha=False)
                      pages.append((pix.width, pix.height, bytes(pix.samples)))
              return pages

          before = render_bytes('/tmp/cv-before.pdf')
          after = render_bytes(pdf_path)
          if len(before) != 3 or len(after) != 3:
              raise SystemExit(f'Expected three pages, got before={len(before)} after={len(after)}')
          if before != after:
              raise SystemExit('PDF raster output changed after URI-only update')
          print('Updated annotations:', updated)
          print('Rendered pages:', len(after))
          print('Visual diff: zero changed pages')
          PY
          rm .github/workflows/_canonical-cv-patch.yml
      - name: Commit PDF patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/assets/documents/cv.pdf .github/workflows/_canonical-cv-patch.yml
          git commit -m 'docs: update CV canonical site annotation'
          git push origin HEAD:docs/publish-canonical-site-links
