name: Temporary P3.5C integration patch

on:
  push:
    branches:
      - feat/p3-5c-english-publications
    paths:
      - scripts/_p3-5c-integration-patch.mjs
      - .github/workflows/_p3-5c-integration-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/p3-5c-english-publications
          fetch-depth: 1
      - name: Apply deterministic integration patch
        run: node scripts/_p3-5c-integration-patch.mjs
      - name: Commit integration and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/page-meta.json docs/toc.yaml scripts/copy-assets.js templates/index.en.html scripts/_p3-5c-integration-patch.mjs .github/workflows/_p3-5c-integration-patch.yml
          git diff --cached --check
          git commit -m 'feat: wire English Publications into site build'
          git push origin HEAD:feat/p3-5c-english-publications
