name: Distribution Readiness

on:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'data/distribution-targets.json'
      - 'data/external-links.json'
      - 'data/page-meta.json'
      - 'scripts/distribution-readiness.js'
      - 'scripts/distribution-readiness.test.js'
      - 'docs/DISTRIBUTION.md'
      - '.github/workflows/distribution-readiness.yml'

permissions:
  contents: read

concurrency:
  group: distribution-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Generate and verify distribution evidence
        shell: bash
        run: |
          set -o pipefail
          node scripts/distribution-readiness.js --check-runbook 2>&1 | tee distribution-readiness.log

      - name: Preserve generator log
        if: always()
        shell: bash
        run: |
          mkdir -p distribution-artifacts
          cp distribution-readiness.log distribution-artifacts/distribution-readiness.log 2>/dev/null || true

      - name: Upload distribution readiness evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distribution-readiness-evidence
          path: distribution-artifacts/
          if-no-files-found: error
          retention-days: 30
