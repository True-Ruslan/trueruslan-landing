name: Temporary N5 acceptance reconciliation

on:
  push:
    branches:
      - docs/reconcile-n5-reader-acceptance

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Apply bounded reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          project_state = Path('docs/PROJECT_STATE.md')
          roadmap = Path('docs/ROADMAP.md')
          changelog = Path('docs/CHANGELOG.md')

          state = project_state.read_text()
          old = '> Последнее смысловое обновление: **2026-08-12**, Navigation IA #217 production-accepted на exact deployed SHA `9831521d5d248fa01c491e3cec031cef07fc8ec5`; controlled launch остаётся `not-published`, P4.1B — IN PROGRESS / SPARSE PRE-LAUNCH BASELINE, P3.6 — WAITING.'
          new = '> Последнее смысловое обновление: **2026-08-13**, Portfolio UX/content polish N2–N5 и Engineering Notes reader architecture #229 production-accepted на exact deployed SHA `1a0db35795aea1ea966e1452bcdb106bb5419ba1`; controlled launch остаётся `not-published`, P4.1B — IN PROGRESS / SPARSE PRE-LAUNCH BASELINE, P3.6/P4.1C — WAITING.'
          assert old in state
          state = state.replace(old, new, 1)
          anchor = 'Repository readiness, generated artifact, deployed production, search-engine observation и external-product acceptance остаются разными фактами.\n\n'
          section = '''## 0.5 2026-08-13 — Portfolio UX/content polish + Engineering Notes reader architecture — PRODUCTION ACCEPTED

          Post-Navigation программа UX/content polish доведена от визуальной коррекции до reader-oriented Engineering Notes architecture без нового runtime, destructive URL migration или SEO-impact claim. Фактический GitHub state имеет приоритет над snapshot от 2026-08-12.

          ### N2–N5 accepted progression

          - **N2 Homepage spacing/symmetry — PRODUCTION ACCEPTED** via PR #221 / deployed SHA `d2911b416c6bc500a8a9543e636ae045d37869e9`; durable acceptance recorded by PR #222.
          - **N3/N3b/N3c Work with me + Now + professional context — PRODUCTION ACCEPTED** via PR #223 / deployed SHA `710db235c99a8cc1258eb44db0fa2c1bb3fc027b`; durable acceptance recorded by PR #224. QWEP remains current full-time commercial context; MarketDB is closed historical commercial/startup context.
          - **N4 Publications card rhythm — PRODUCTION ACCEPTED** via PR #225 / deployed SHA `0cb8028c5bac21c94daf8c16671d99e8f7fac38f`; durable acceptance recorded by PR #226.
          - **N5 Engineering Notes audit — MERGED / RESEARCH ACCEPTED** via PR #227 / `c2292fb56b1396e994a348d3811015e2f8b6ea4b`: 16 Notes, ~17,351 prose words, 174 section headings, 3 overlap review pairs, no merge/delete/canonical consolidation selected. Audit conclusion: primary problem was reader orientation, not insufficient substance.
          - **N5 reader architecture design — MERGED** via PR #228 / `14e966a0da47a659cbedab2fa3b6834353097ecc`.

          ### Engineering Notes reader architecture — PRODUCTION ACCEPTED

          PR #229 implemented the selected non-destructive reader architecture: `/landing/notes/` remains the single hub; `data/notes.json` remains canonical; all 16 Notes belong to exactly one of three validated series with explicit `seriesOrder` and `readerRole`; the hub renders `С чего начать`, three guided series and the complete chronological `Все заметки` catalogue. Existing Note URLs, canonical/feed/search/clean-route ownership and no-JS usefulness are preserved. No second manifest, runtime content API, client-side filtering or second search owner was introduced.

          ```text
          PR:                              #229
          TDD RED head:                    15a54a2d152e77429fd440cefe379a5504ef5f66
          RED Build:                       #2035 — 778 PASS / 4 intended reader-contract FAIL
          final feature head:              b5567fdd14430c67746da2dbbbfb0dee1f491470
          exact-head Build:                #2044 / 31685171581 — SUCCESS
          Dependency Review:               31685171386 — SUCCESS
          CodeQL:                          #1612 / 31685171699 — SUCCESS
          quality artifact:                9175280938
          quality digest:                  sha256:eb367d8b81ca203b54d58d4b474d699ec64f4ca6f07f0988c5c5f162b42dc025
          accepted squash / deployed SHA:  1a0db35795aea1ea966e1452bcdb106bb5419ba1
          Pages:                           #251 / 31685895669 — SUCCESS
          Pages deployment ID:             5885271220
          Pages artifact:                  9175388951
          Pages artifact digest:           sha256:68b36f9f44ea475cbb344d1a39c10fde67ecd3a837f280e17b66b9ff122b9200
          Pages verification reports:      9175392494
          Pages reports digest:            sha256:556786a26ecb3dce249ace8cf86c48ab8a23e773ae0934589a4246f7b7d781f5
          Production Live Smoke:           #556 / 31685963890 — SUCCESS
          production artifact:             9175455505
          production digest:               sha256:1a08c34a1bc911ee78771528efa1808dd8e6a9e95b8a1c69fda025bbe72c673d
          master CodeQL:                   #1613 / 31685895573 — SUCCESS
          ```

          Exact-head browser acceptance proved **16 catalogue cards / 3 Start here choices / 3 series / 16 guided Notes / 0 horizontal overflow / 0 serious-or-critical Axe violations** in enhanced mobile, with the same reader architecture available in no-JS desktop. CI screenshots were reviewed; the large pre-fallback no-JS shell gap was compared against the previously accepted N5 baseline and confirmed pre-existing rather than introduced by #229. Durable ledger: `docs/acceptance/2026-08-13-engineering-notes-reader-architecture.md`.

          This closes the selected N5 implementation, not external search/product-impact acceptance. **Controlled launch remains `not-published`; P4.1B remains IN PROGRESS / SPARSE PRE-LAUNCH BASELINE; P4.1C remains WAITING; P3.6 remains NEXT / WAITING FOR EXTERNAL EVIDENCE.** The clean-URL observation clock remains `2026-08-05T00:00:00Z`. The next operator action is deliberate controlled manual launch, then accumulation/review of real external observations before any evidence-backed P4.1C change.

          '''
          section = '\n'.join(line[10:] if line.startswith('          ') else line for line in section.splitlines()) + '\n'
          assert '## 0.5 2026-08-13' not in state
          state = state.replace(anchor, anchor + section, 1)
          project_state.write_text(state)

          road = roadmap.read_text()
          old = '> Обновлено: **2026-08-12**, Navigation IA #217 production-accepted; controlled launch остаётся `not-published`, P4.1B — IN PROGRESS / SPARSE PRE-LAUNCH BASELINE, P3.6/P4.1C остаются evidence-gated.'
          new = '> Обновлено: **2026-08-13**, N2–N5 UX/content polish и Engineering Notes reader architecture #229 production-accepted; controlled launch остаётся `not-published`, P4.1B — IN PROGRESS / SPARSE PRE-LAUNCH BASELINE, P3.6/P4.1C остаются evidence-gated.'
          assert old in road
          road = road.replace(old, new, 1)
          anchor = '> Current state — `docs/PROJECT_STATE.md`; history — `docs/CHANGELOG.md`; specification — `docs/keystone/specs/2026-08-05-portfolio-1-0-evidence-first.md`.\n\n'
          section = '''## 2026-08-13 accepted Portfolio UX/content polish + Engineering Notes reader architecture

          - **N2 Homepage — DONE / PRODUCTION ACCEPTED** via PR #221; durable acceptance #222.
          - **N3/N3b/N3c Work with me / Now / professional context — DONE / PRODUCTION ACCEPTED** via PR #223; durable acceptance #224.
          - **N4 Publications — DONE / PRODUCTION ACCEPTED** via PR #225; durable acceptance #226.
          - **N5 Engineering Notes audit — DONE / RESEARCH ACCEPTED** via PR #227: all 16 Notes retained; no destructive merge/delete/canonical migration selected; reader orientation identified as the actual problem.
          - **N5 reader architecture design — DONE** via PR #228.
          - **N5 selected reader implementation — DONE / PRODUCTION ACCEPTED** via PR #229 / exact deployed SHA `1a0db35795aea1ea966e1452bcdb106bb5419ba1`. The hub now provides `С чего начать`, three validated guided series and the complete `Все заметки` catalogue from the same canonical `data/notes.json`; all current Note routes/search/feed/canonical/clean-URL contracts remain unchanged.
          - PR #229 exact-head Build #2044 / `31685171581`, Dependency Review `31685171386`, CodeQL #1612 / `31685171699` — SUCCESS; Pages #251 / `31685895669`, deployment `5885271220`, Production Live #556 / `31685963890`, master CodeQL #1613 / `31685895573` — SUCCESS. Durable acceptance: `docs/acceptance/2026-08-13-engineering-notes-reader-architecture.md`.
          - **Portfolio UX/content polish implementation sequence N1–N5 is complete.** Further unguided visual/SEO rewriting is not the next product step.
          - **Next operator action: controlled manual launch** using the already accepted launch pack. Repository automation must not post, authenticate, schedule or mutate external publication state.
          - After launch, accumulate real Search Console / Yandex Webmaster observations before P4.1C metadata/copy/internal-link decisions. P4.1B remains sparse/in-progress; P4.1C and P3.6 remain evidence-gated; clean-URL clock remains `2026-08-05T00:00:00Z`.
          - Maintenance remains separate: issue #82 upstream Diplodoc/markdown-it blocker is still open; Content Freshness #78 must be reconciled only from fresh Vlezet/VillAIgence/Portfolio evidence, not from this presentation acceptance.

          '''
          section = '\n'.join(line[10:] if line.startswith('          ') else line for line in section.splitlines()) + '\n'
          assert '## 2026-08-13 accepted Portfolio UX/content polish' not in road
          road = road.replace(anchor, anchor + section, 1)
          roadmap.write_text(road)

          change = changelog.read_text()
          old = '> Обновлено: **2026-08-12**, Navigation IA #217 production-reconciled; controlled launch остаётся `not-published`, P4.1B review — IN PROGRESS / SPARSE PRE-LAUNCH BASELINE, P3.6/P4.1C остаются открытыми.'
          new = '> Обновлено: **2026-08-13**, N2–N5 UX/content polish и Engineering Notes reader architecture #229 production-reconciled; controlled launch остаётся `not-published`, P4.1B review — IN PROGRESS / SPARSE PRE-LAUNCH BASELINE, P3.6/P4.1C остаются открытыми.'
          assert old in change
          change = change.replace(old, new, 1)
          anchor = '> Current state — `docs/PROJECT_STATE.md`; next steps — `docs/ROADMAP.md`; specification — `docs/keystone/specs/2026-08-05-portfolio-1-0-evidence-first.md`.\n\n'
          section = '''## 2026-08-13 — Portfolio UX/content polish + Engineering Notes reader architecture — PRODUCTION ACCEPTED

          - N2 Homepage spacing/symmetry shipped through PR #221 (`d2911b416c6bc500a8a9543e636ae045d37869e9`) and durable acceptance #222.
          - N3/N3b/N3c Work with me / Now / professional-context polish shipped through PR #223 (`710db235c99a8cc1258eb44db0fa2c1bb3fc027b`) and durable acceptance #224.
          - N4 Publications card-rhythm refinement shipped through PR #225 (`0cb8028c5bac21c94daf8c16671d99e8f7fac38f`) and durable acceptance #226.
          - N5 audit PR #227 (`c2292fb56b1396e994a348d3811015e2f8b6ea4b`) inventoried all 16 Engineering Notes, rejected destructive consolidation, fixed the exact-host GitHub evidence validation issue surfaced by CodeQL, and selected reader orientation as the bounded next implementation.
          - Design PR #228 (`14e966a0da47a659cbedab2fa3b6834353097ecc`) specified one Notes hub, three reader series, preserved chronological catalogue, intentional related graph and targeted scan-copy clarification.
          - Implementation PR #229 started with intentional RED Build #2035 at `15a54a2d152e77429fd440cefe379a5504ef5f66`: 778 tests passed and exactly four new reader contracts failed before production changes.
          - Final PR #229 head `b5567fdd14430c67746da2dbbbfb0dee1f491470` passed Build #2044 / `31685171581`, Dependency Review `31685171386`, CodeQL #1612 / `31685171699`, the complete browser/Axe/Lighthouse/Firefox/WebKit/no-JS/visual/search/custom-domain matrix and the dedicated Notes reader smoke. Quality artifact `9175280938`, digest `sha256:eb367d8b81ca203b54d58d4b474d699ec64f4ca6f07f0988c5c5f162b42dc025`.
          - PR #229 squash / deployed SHA `1a0db35795aea1ea966e1452bcdb106bb5419ba1`; Pages #251 / `31685895669` — SUCCESS, deployment `5885271220`, Pages artifact `9175388951` / `sha256:68b36f9f44ea475cbb344d1a39c10fde67ecd3a837f280e17b66b9ff122b9200`, verification reports `9175392494` / `sha256:556786a26ecb3dce249ace8cf86c48ab8a23e773ae0934589a4246f7b7d781f5`; Production Live #556 / `31685963890` — SUCCESS, artifact `9175455505` / `sha256:1a08c34a1bc911ee78771528efa1808dd8e6a9e95b8a1c69fda025bbe72c673d`; master CodeQL #1613 / `31685895573` — SUCCESS.
          - Reader result: 16 catalogue cards, 3 Start here choices, 3 guided series, 16 guided Notes, zero mobile/no-JS horizontal overflow and zero serious/critical Axe violations; all existing Note URL/canonical/feed/search/clean-route identities remain intact.
          - No SEO/ranking/engagement/conversion claim is introduced. Controlled launch remains `not-published`; P4.1B remains sparse/in-progress; P4.1C and P3.6 remain waiting; clean-URL clock remains `2026-08-05T00:00:00Z`.

          '''
          section = '\n'.join(line[10:] if line.startswith('          ') else line for line in section.splitlines()) + '\n'
          assert '## 2026-08-13 — Portfolio UX/content polish' not in change
          change = change.replace(anchor, anchor + section, 1)
          changelog.write_text(change)

          acceptance = Path('docs/acceptance/2026-08-13-engineering-notes-reader-architecture.md')
          acceptance.write_text('''# Engineering Notes Reader Architecture — Production Acceptance

          Date: **2026-08-13**  
          Status: **PRODUCTION ACCEPTED**

          ## Accepted scope

          This ledger records the bounded N5 Engineering Notes reader-architecture implementation selected by audit PR #227 and design PR #228.

          Accepted behavior:

          - `/landing/notes/` remains the single public Notes hub;
          - `data/notes.json` remains the canonical per-Note registry;
          - all 16 current Notes remain published on their existing URLs;
          - every Note has validated `series`, `seriesOrder` and `readerRole`;
          - the hub renders one compact `С чего начать` block, three guided reader series and the complete chronological `Все заметки` catalogue;
          - established meaningful related-reading edges are preserved and every Note has at least one inbound/outbound registry path;
          - the four N5 zero-inbound deep dives receive deliberate inbound paths;
          - six audited scan-copy descriptions are clarified without new factual claims;
          - enhanced and no-JS representations expose the same reader architecture;
          - existing generated search, Atom feed, canonical, clean-route, sitemap and metadata ownership remain unchanged.

          Not introduced:

          - no Note deletion, merge, redirect or canonical consolidation;
          - no runtime content API;
          - no client-side filtering requirement;
          - no second Notes/series manifest;
          - no second search owner;
          - no SEO, ranking, CTR, engagement or conversion claim.

          ## TDD evidence

          Initial RED head:

          ```text
          15a54a2d152e77429fd440cefe379a5504ef5f66
          ```

          Build #2035 intentionally failed at `Test` with **778 PASS / 4 FAIL**. The failures were exactly the new reader contracts: reader-schema validation, exact series assignment, inbound graph completeness and hub reader rendering. Production manifest/renderer remained unchanged at that RED stage.

          Existing regression tests subsequently surfaced accepted historical related edges and integration-fixture assumptions. The implementation preserved those historical relationships and upgraded the fixtures to exercise the same strict reader schema rather than weakening production validation.

          ## Exact-head acceptance

          ```text
          final feature head:     b5567fdd14430c67746da2dbbbfb0dee1f491470
          Build:                  #2044 / 31685171581 — SUCCESS
          Dependency Review:      31685171386 — SUCCESS
          CodeQL:                 #1612 / 31685171699 — SUCCESS
          quality artifact:       9175280938
          quality digest:         sha256:eb367d8b81ca203b54d58d4b474d699ec64f4ca6f07f0988c5c5f162b42dc025
          ```

          The exact-head matrix passed unit/contract tests, production-like docs build, generated-site integrity, mobile overflow, browser accessibility + Lighthouse, dedicated Publications/Sources/Engineering Notes/Project Evidence smokes, Firefox/WebKit compatibility, RU/EN + generated search, privacy/Metrica, metadata/OpenGraph, Engineering Map, visual regression, custom-domain artifact and Search Discovery readiness.

          Dedicated Notes reader browser evidence:

          ```text
          enhanced mobile: 16 catalogue / 3 Start here / 3 series / 16 guided / 0 overflow / 0 serious-critical Axe
          no-JS desktop:    16 catalogue / 3 Start here / 3 series / 16 guided / 0 overflow
          ```

          CI screenshots were manually reviewed. A large blank region above the no-JS fallback was compared against the previously accepted N5 audit screenshot and confirmed to be pre-existing Diplodoc no-JS shell behavior rather than a regression introduced by PR #229.

          ## Exact production acceptance

          ```text
          PR #229 squash / deployed SHA:  1a0db35795aea1ea966e1452bcdb106bb5419ba1
          Pages:                           #251 / 31685895669 — SUCCESS
          GitHub Pages deployment:         5885271220
          Pages artifact:                  9175388951
          Pages artifact digest:           sha256:68b36f9f44ea475cbb344d1a39c10fde67ecd3a837f280e17b66b9ff122b9200
          Pages verification reports:      9175392494
          Pages reports digest:            sha256:556786a26ecb3dce249ace8cf86c48ab8a23e773ae0934589a4246f7b7d781f5
          Production Live Smoke:           #556 / 31685963890 — SUCCESS
          Production Live artifact:        9175455505
          Production Live digest:          sha256:1a08c34a1bc911ee78771528efa1808dd8e6a9e95b8a1c69fda025bbe72c673d
          master CodeQL:                   #1613 / 31685895573 — SUCCESS
          ```

          Repository readiness, feature-head acceptance, merged deployment and production observation all resolve to the intended bounded reader architecture.

          ## External-state boundary

          This acceptance does **not** change external evidence or publication state:

          - controlled launch: `not-published`;
          - P4.1B: `IN PROGRESS / SPARSE PRE-LAUNCH BASELINE`;
          - P4.1C: `WAITING`;
          - P3.6: `NEXT / WAITING FOR EXTERNAL EVIDENCE`;
          - clean-URL observation clock: `2026-08-05T00:00:00Z`.

          The next operator action is the already-prepared deliberate controlled manual launch. Search/copy/internal-link changes after that remain evidence-gated.
          '''.replace('\n          ', '\n').lstrip())
          PY

          rm .github/workflows/tmp-export-reconciliation-docs.yml
          git diff --check
          expected=$(printf '%s\n' \
            '.github/workflows/tmp-export-reconciliation-docs.yml' \
            'docs/CHANGELOG.md' \
            'docs/PROJECT_STATE.md' \
            'docs/ROADMAP.md' \
            'docs/acceptance/2026-08-13-engineering-notes-reader-architecture.md')
          actual=$(git status --short | sed -E 's/^.. //' | sort)
          if [[ "$actual" != "$(printf '%s\n' "$expected" | sort)" ]]; then
            printf 'Unexpected reconciliation scope:\n%s\n' "$actual" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PROJECT_STATE.md docs/ROADMAP.md docs/CHANGELOG.md docs/acceptance/2026-08-13-engineering-notes-reader-architecture.md .github/workflows/tmp-export-reconciliation-docs.yml
          git commit -m 'docs: reconcile N5 reader production acceptance'
          git push origin HEAD:docs/reconcile-n5-reader-acceptance
