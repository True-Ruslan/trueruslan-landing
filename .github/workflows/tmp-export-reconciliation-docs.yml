name: Temporary reconciliation docs export

on:
  push:
    branches:
      - docs/reconcile-n5-reader-acceptance

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Upload reconciliation source docs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reconciliation-source-docs
          path: |
            docs/PROJECT_STATE.md
            docs/ROADMAP.md
            docs/CHANGELOG.md
          if-no-files-found: error
          retention-days: 1
