name: Temporary P3.6 durable state updater

on:
  push:
    branches:
      - feat/p3-6c-consent-gated-yandex-metrica
    paths:
      - '.github/workflows/tmp-p36c-durable-state.yml'
      - 'scripts/tmp-update-p36c-durable-state.mjs'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/p3-6c-consent-gated-yandex-metrica
          fetch-depth: 0
          persist-credentials: true
      - name: Update durable state
        run: node scripts/tmp-update-p36c-durable-state.mjs
      - name: Commit exact durable files
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PROJECT_STATE.md docs/ROADMAP.md docs/CHANGELOG.md
          test -n "$(git diff --cached --name-only)"
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = '3'
          git commit -m 'docs: record P3.6B and P3.6C state'
          git push origin HEAD:feat/p3-6c-consent-gated-yandex-metrica
