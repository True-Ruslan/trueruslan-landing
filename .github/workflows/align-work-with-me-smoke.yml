name: Align work-with-me smoke

on:
  push:
    branches:
      - fix/homepage-work-with-me-style

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
      - name: Align smoke selector
        run: node .github/scripts/align-work-with-me-smoke.cjs
      - name: Install dependencies
        run: npm ci
      - name: Verify homepage unit tests
        run: node --test scripts/standalone-home.test.js
      - name: Commit alignment and remove helper
        shell: bash
        run: |
          rm .github/scripts/align-work-with-me-smoke.cjs
          rm .github/workflows/align-work-with-me-smoke.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/work-with-me-browser-smoke.cjs .github/scripts/align-work-with-me-smoke.cjs .github/workflows/align-work-with-me-smoke.yml
          git commit -m "test: align work-with-me smoke with bridge action"
          git push origin HEAD:fix/homepage-work-with-me-style
