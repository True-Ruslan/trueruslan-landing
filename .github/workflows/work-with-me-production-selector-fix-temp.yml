name: Work with me Production Selector Fix Temp

on:
  push:
    branches:
      - fix/production-work-with-me-selector

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Apply selector fix and focused regression
        run: |
          node scripts/work-with-me-production-selector-fix.cjs
          node --test scripts/production-work-with-me-workflow.test.js

      - name: Remove temporary automation
        run: |
          rm scripts/work-with-me-production-selector-fix.cjs
          rm .github/workflows/work-with-me-production-selector-fix-temp.yml

      - name: Verify and commit
        run: |
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: align production Work with me CTA contract"
          git push origin HEAD:fix/production-work-with-me-selector
