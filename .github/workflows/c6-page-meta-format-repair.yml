name: C6 page-meta format repair
# Registered-trigger commit: the workflow already exists in the parent revision.

on:
  push:
    branches:
      - feat/portfolio-clarity-c6-en-seo
    paths:
      - .github/workflows/c6-page-meta-format-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/portfolio-clarity-c6-en-seo
          fetch-depth: 0

      - name: Restore base formatting and keep only C6 metadata changes
        run: |
          set -euo pipefail
          git show 8335e0f0fda66691536df9aa501c81ceff7cb0f6:data/page-meta.json > /tmp/page-meta.json
          python3 - <<'PY'
          from pathlib import Path
          source = Path('/tmp/page-meta.json').read_text(encoding='utf-8')

          old_home = '''  {
            "path": "en/index.html",
            "card": "home-en",
            "title": "Ruslan Nemykin — Backend Engineer",
            "description": "Engineering portfolio of Ruslan Nemykin: Java backend, distributed systems, DevOps, AI engineering, projects and technical notes.",
            "displayTitle": "RUSLAN NEMYKIN",
            "kicker": "BACKEND ENGINEER",
            "tags": ["JAVA", "DISTRIBUTED SYSTEMS", "AI ENGINEERING"],
            "accent": "cyan"
          },'''
          new_home = old_home.replace(
              '"title": "Ruslan Nemykin — Backend Engineer"',
              '"title": "Ruslan Nemykin — Java Backend Engineer"',
          ).replace(
              '"kicker": "BACKEND ENGINEER"',
              '"kicker": "JAVA BACKEND ENGINEER"',
          )

          old_resume = '''  {
            "path": "en/resume.html",
            "card": "resume-en",
            "title": "Resume — Ruslan Nemykin",
            "description": "Java backend engineer with more than 5 years of commercial experience across Spring Boot systems, Kafka, PostgreSQL, Oracle, ClickHouse, integrations and AI/MCP tooling.",
            "displayTitle": "ENGINEERING RESUME",
            "kicker": "RUSLAN NEMYKIN",
            "tags": ["JAVA", "SPRING", "DEVOPS"],
            "accent": "cyan"
          },'''
          new_resume = old_resume.replace(
              '"title": "Resume — Ruslan Nemykin"',
              '"title": "Experience — Ruslan Nemykin"',
          ).replace(
              '"displayTitle": "ENGINEERING RESUME"',
              '"displayTitle": "ENGINEERING EXPERIENCE"',
          )

          if source.count(old_home) != 1:
              raise SystemExit(f'expected one EN home metadata block, found {source.count(old_home)}')
          if source.count(old_resume) != 1:
              raise SystemExit(f'expected one EN resume metadata block, found {source.count(old_resume)}')

          updated = source.replace(old_home, new_home, 1).replace(old_resume, new_resume, 1)
          Path('data/page-meta.json').write_text(updated, encoding='utf-8')
          PY
          git diff --check

      - name: Commit metadata diff cleanup
        run: |
          set -euo pipefail
          git add data/page-meta.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove non-C6 page-meta formatting noise'
          git push origin HEAD:feat/portfolio-clarity-c6-en-seo
