name: Temporary canonical README patch

on:
  push:
    branches:
      - docs/publish-canonical-site-links

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/publish-canonical-site-links
          fetch-depth: 0
      - name: Patch README and remove temporary workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          canonical = '**Production:** [trueruslan.ru](https://trueruslan.ru/)'
          marker = '\n\n## Архитектура'
          if canonical in text:
              raise SystemExit('Canonical production link already exists')
          if text.count(marker) != 1:
              raise SystemExit(f'Expected one architecture marker, found {text.count(marker)}')
          path.write_text(text.replace(marker, f'\n\n{canonical}{marker}', 1), encoding='utf-8')
          PY
          rm .github/workflows/_canonical-link-patch.yml
          test "$(grep -o 'https://trueruslan.ru/' README.md | wc -l | tr -d ' ')" = "1"
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .github/workflows/_canonical-link-patch.yml
          git commit -m 'docs: expose canonical production site'
          git push origin HEAD:docs/publish-canonical-site-links
