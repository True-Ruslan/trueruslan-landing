name: AI-7 answer gate patch once

on:
  push:
    branches:
      - feat/ai7-full-canary

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Apply independent answer gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          worker_path = Path('infra/cloudflare/ai-navigator-worker.mjs')
          worker = worker_path.read_text()
          marker = 'async function handleAnswer(request, env, fetchImpl, corsOrigin) {'
          marker_index = worker.find(marker)
          if marker_index < 0:
              raise SystemExit('handleAnswer marker not found')
          prefix = worker[:marker_index]
          answer = worker[marker_index:]
          old_worker = "  if (env.AI_ENABLED !== 'true') {\n    return errorResponse(503, 'feature_disabled', 'AI feature is disabled.', {origin: corsOrigin});\n  }\n  if (typeof env.OPENROUTER_API_KEY !== 'string' || !env.OPENROUTER_API_KEY.trim()) {"
          new_worker = "  if (env.AI_ENABLED !== 'true') {\n    return errorResponse(503, 'feature_disabled', 'AI feature is disabled.', {origin: corsOrigin});\n  }\n  if (env.AI_ANSWER_ENABLED !== 'true') {\n    return errorResponse(503, 'feature_disabled', 'AI answer feature is disabled.', {origin: corsOrigin});\n  }\n  if (typeof env.OPENROUTER_API_KEY !== 'string' || !env.OPENROUTER_API_KEY.trim()) {"
          count = answer.count(old_worker)
          if count != 1:
              raise SystemExit(f'handleAnswer: expected one guarded match, got {count}')
          worker_path.write_text(prefix + answer.replace(old_worker, new_worker, 1))

          test_path = Path('scripts/ai-navigator-answer-worker.test.js')
          test_text = test_path.read_text()
          old_test = "    AI_ENABLED: 'true',\n    OPENROUTER_API_KEY: 'test-secret-key',"
          new_test = "    AI_ENABLED: 'true',\n    AI_ANSWER_ENABLED: 'true',\n    OPENROUTER_API_KEY: 'test-secret-key',"
          count = test_text.count(old_test)
          if count != 1:
              raise SystemExit(f'answer worker test env: expected one guarded match, got {count}')
          test_path.write_text(test_text.replace(old_test, new_test, 1))
          PY

          git diff --check
          node --test scripts/ai7-answer-enable-gate.test.js scripts/ai-navigator-answer-worker.test.js

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add infra/cloudflare/ai-navigator-worker.mjs scripts/ai-navigator-answer-worker.test.js
          git rm .github/workflows/ai7-answer-gate-patch-once.yml
          git commit -m 'feat(ai): require explicit FULL answer enablement'
          git push origin HEAD:feat/ai7-full-canary
