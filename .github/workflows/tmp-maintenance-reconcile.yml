name: Temporary maintenance evidence reconciliation

on:
  push:
    branches:
      - docs/reconcile-maintenance-evidence

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Patch durable maintenance evidence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'anchor not found in {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          state_header_old = '> Последнее смысловое обновление: **2026-08-12**, после production acceptance launch distribution, launch preview metadata и P4.1A Search Discovery readiness; P3.6 measurement и P4.1B external evidence остаются открытыми.'
          state_header_new = '> Последнее смысловое обновление: **2026-08-12**, после production acceptance launch/discovery и maintenance reconciliation; P3.6 measurement и P4.1B external evidence остаются открытыми.'
          replace_once('docs/PROJECT_STATE.md', state_header_old, state_header_new)

          state_anchor = 'Repository readiness, generated artifact, deployed production, search-engine observation и external-product acceptance остаются разными фактами.\n\n## 0. 2026-08-12 — Current launch / discovery acceptance'
          state_block = '''Repository readiness, generated artifact, deployed production, search-engine observation и external-product acceptance остаются разными фактами.

## 0.1 2026-08-12 — Current maintenance acceptance / dependency blocker

### CodeQL Action 4.37.6 — PRODUCTION ACCEPTED

```text
PR #205 squash / deployed SHA:  94a3748e5fd82ac707f2bcc69e4cab255ba217e5
Build:                          #1887 / 31579461177 — SUCCESS
CodeQL:                         #1435 / 31579461126 — SUCCESS
Pages:                          #230 / 31580165353 — SUCCESS
Production Live Smoke:          #511 / 31580165196 — SUCCESS
```

CodeQL `init` и `analyze` используют pin v4.37.6; permissions, query set, language scope, runner и schedule не менялись. Post-merge CodeQL #1437 и scheduled Production Live #513 также завершились SUCCESS на том же exact SHA.

### Diplodoc dependency candidate — CLOSED UNMERGED / SECURITY BLOCKED

```text
PR #185 — CLOSED UNMERGED / SECURITY BLOCKED
candidate head:                 c4e6b8dd87f224ed92dca8598d8d49737bea1d0f
Build:                          #1889 / 31580402647 — SUCCESS
CodeQL:                         #1438 / 31580402681 — SUCCESS
Dependency Review:              #1311 / 31580402632 — SUCCESS
Dependency Audit:               #222 / 31580402634 — 7 moderate / 0 high / 0 critical
```

Functional acceptance была зелёной, но candidate увеличивал package-level footprint двух известных `markdown-it` advisories с 6 до 7 records. Поэтому issue #82 — OPEN blocker; exit criteria не выполнены, следующий review остаётся **2026-08-17**, без forced `npm audit fix`, shim или fork.

PR #207 — CLOSED UNMERGED: Dependabot после config fix сгенерировал тот же dependency candidate; его `package-lock.json` byte-identical PR #185, blob `dac054d274e48ce93828e97b83d09cc121024575`, поэтому повторный merge запрещён тем же issue #82 boundary.

### Dependabot configuration — PRODUCTION ACCEPTED

```text
PR #206 squash / deployed SHA:  ef40c960e1849ee0551cb478d0cd71a3f69ef601
TDD RED Build:                  #1890 / 31581385552 — expected FAILURE
Build:                          #1891 / 31581517909 — SUCCESS
unit tests:                     715 PASS / 0 FAIL
CodeQL:                         #1440 / 31581517924 — SUCCESS
Dependency Review:              #1313 / 31581517896 — SUCCESS
Pages:                          #231 / 31582194873 — SUCCESS
Production Live Smoke:          #515 / 31582244697 — SUCCESS
```

Dependabot unmanaged labels (`dependencies`, `security`, `github-actions`) больше не запрашиваются без repository-owned manifest/provisioning path. Реальные post-merge npm и GitHub Actions Dependabot runs `31582199568` и `31582199031` завершились SUCCESS; новый #207 создан без removed labels и без label-warning comments.

Maintenance не меняет продуктовую или external-evidence семантику: P3.6 остаётся **NEXT / WAITING FOR EXTERNAL EVIDENCE**, clean-URL clock `2026-08-05T00:00:00Z` не сбрасывается, P4.1B остаётся **NEXT**, P4.1C — **WAITING**.

## 0. 2026-08-12 — Current launch / discovery acceptance'''
          replace_once('docs/PROJECT_STATE.md', state_anchor, state_block)

          roadmap_header_old = '> Обновлено: **2026-08-12**, launch distribution, launch preview metadata и P4.1A Search Discovery production-accepted; P3.6 measurement и P4.1B external evidence ожидают реальные observations.'
          roadmap_header_new = '> Обновлено: **2026-08-12**, launch/discovery и maintenance baseline reconciled; P3.6 measurement и P4.1B external evidence ожидают реальные observations.'
          replace_once('docs/ROADMAP.md', roadmap_header_old, roadmap_header_new)

          roadmap_anchor = '## 2026-08-12 accepted launch / discovery baseline'
          roadmap_block = '''## 2026-08-12 accepted maintenance baseline

- PR #205 / `94a3748e5fd82ac707f2bcc69e4cab255ba217e5`: CodeQL Action v4.37.6; Build #1887 / 31579461177 — SUCCESS; CodeQL #1435 / 31579461126 — SUCCESS; Pages #230 / 31580165353 — SUCCESS; Production Live Smoke #511 / 31580165196 — SUCCESS.
- PR #185 — **CLOSED UNMERGED / SECURITY BLOCKED** at `c4e6b8dd87f224ed92dca8598d8d49737bea1d0f`: functional CI green, but Dependency Audit #222 / 31580402634 reported **7 moderate / 0 high / 0 critical**; issue #82 — OPEN blocker, next review **2026-08-17**.
- PR #207 — **CLOSED UNMERGED**: regenerated candidate has byte-identical `package-lock.json` blob `dac054d274e48ce93828e97b83d09cc121024575`, therefore inherits the same #82 blocker.
- PR #206 / `ef40c960e1849ee0551cb478d0cd71a3f69ef601`: removed Dependabot unmanaged labels; TDD RED Build #1890 / 31581385552 — expected FAILURE; final Build #1891 / 31581517909 — SUCCESS; 715 PASS / 0 FAIL; Pages #231 / 31582194873 — SUCCESS; Production Live Smoke #515 / 31582244697 — SUCCESS.
- Dependency maintenance must remain fail-closed: functional green does not override an increased known-vulnerability footprint.
- P3.6 remains **NEXT / WAITING FOR EXTERNAL EVIDENCE**; `2026-08-05T00:00:00Z` remains the clean-URL observation clock. **P4.1B — NEXT**, **P4.1C — WAITING**.

## 2026-08-12 accepted launch / discovery baseline'''
          replace_once('docs/ROADMAP.md', roadmap_anchor, roadmap_block)

          changelog_header_old = '> Обновлено: **2026-08-12**, launch distribution, launch preview metadata и P4.1A Search Discovery production-accepted; P3.6 measurement и P4.1B external evidence остаются открытыми.'
          changelog_header_new = '> Обновлено: **2026-08-12**, launch/discovery и maintenance evidence reconciled; P3.6 measurement и P4.1B external evidence остаются открытыми.'
          replace_once('docs/CHANGELOG.md', changelog_header_old, changelog_header_new)

          changelog_anchor = '## 2026-08-12 — Launch / Discovery production reconciliation'
          changelog_block = '''## 2026-08-12 — Maintenance evidence reconciliation

- PR #205 accepted the CodeQL Action v4.37.6 pin on exact deployed SHA `94a3748e5fd82ac707f2bcc69e4cab255ba217e5`: Build #1887 / 31579461177 — SUCCESS; CodeQL #1435 / 31579461126 — SUCCESS; Pages #230 / 31580165353 — SUCCESS; Production Live Smoke #511 / 31580165196 — SUCCESS. No query/language/permission/schedule semantics changed.
- Recreated PR #185 at `c4e6b8dd87f224ed92dca8598d8d49737bea1d0f` passed Build #1889, CodeQL #1438 and Dependency Review #1311, but Dependency Audit #222 / 31580402634 reported **7 moderate / 0 high / 0 critical** versus the accepted issue #82 baseline of 6 package records. PR #185 was therefore **CLOSED UNMERGED / SECURITY BLOCKED**; issue #82 remains OPEN blocker with next review **2026-08-17**.
- PR #206 removed explicit Dependabot unmanaged labels only; RED Build #1890 / 31581385552 failed the new regression contract as expected, final Build #1891 / 31581517909 — SUCCESS with **715 PASS / 0 FAIL**, CodeQL #1440 and Dependency Review #1313 — SUCCESS, Pages #231 / 31582194873 — SUCCESS, Production Live Smoke #515 / 31582244697 — SUCCESS.
- Post-merge Dependabot npm run `31582199568` and GitHub Actions run `31582199031` both completed SUCCESS. They created PR #207 without the removed labels or label-warning comments, proving the configuration fix operationally.
- PR #207 was **CLOSED UNMERGED** because its `package-lock.json` blob `dac054d274e48ce93828e97b83d09cc121024575` is byte-identical to rejected #185 and inherits the same issue #82 blocker.
- No P3.6 or P4.1 external-evidence state changed: clean-URL clock remains `2026-08-05T00:00:00Z`, P4.1B remains **NEXT**, P4.1C remains **WAITING**.

## 2026-08-12 — Launch / Discovery production reconciliation'''
          replace_once('docs/CHANGELOG.md', changelog_anchor, changelog_block)
          PY

      - name: Commit durable docs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT_STATE.md docs/ROADMAP.md docs/CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No durable-doc changes required"
            exit 0
          fi
          git commit -m "docs: record current maintenance evidence"
          git push
