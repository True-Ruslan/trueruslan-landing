name: Temporary maintenance evidence reconciliation

on:
  push:
    branches:
      - docs/reconcile-maintenance-evidence

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Patch durable maintenance evidence
        run: python3 scripts/tmp-maintenance-reconcile.py

      - name: Commit durable docs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT_STATE.md docs/ROADMAP.md docs/CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No durable-doc changes required"
            exit 0
          fi
          git commit -m "docs: record current maintenance evidence"
          git push
