name: Build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build docs
        run: npm run build:docs
      - name: Check generated site integrity
        shell: bash
        run: |
          mkdir -p quality-artifacts
          cp docs-html/_search/ru/index.html quality-artifacts/search-index.html 2>/dev/null || true
          set -o pipefail
          npm run check:site 2>&1 | tee quality-artifacts/site-integrity.log
      - name: Install pinned browser quality tools
        run: >-
          npm install --prefix .quality-tools --package-lock=false --no-save
          playwright@1.61.1 @axe-core/playwright@4.12.1 lighthouse@13.4.0
      - name: Browser smoke, accessibility and Lighthouse
        shell: bash
        run: |
          set -o pipefail
          node scripts/browser-quality.cjs 2>&1 | tee quality-artifacts/browser-quality.log
      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-artifacts
          path: quality-artifacts/
          if-no-files-found: ignore
          retention-days: 14
