name: Build

on:
  pull_request:

permissions:
  contents: write

jobs:
  p3-6a-state-patch:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'docs/p3-6a-readiness-acceptance'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout P3.6A closure branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/p3-6a-readiness-acceptance
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Apply deterministic P3.6A durable-state patch
        run: node scripts/temp-p3-6a-state-patch.cjs

      - name: Verify patch
        shell: bash
        run: |
          git diff --check
          git status --short

      - name: Commit patched durable state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/PROJECT_STATE.md \
            docs/ROADMAP.md \
            docs/CHANGELOG.md \
            docs/keystone/specs/2026-08-05-portfolio-1-0-evidence-first.md \
            docs/keystone/specs/2026-08-07-p3-6-measurement-readiness.md
          git diff --cached --quiet && { echo "Expected durable-state patch produced no changes" >&2; exit 1; }
          git commit -m "docs: close P3.6A readiness acceptance"
          git push origin HEAD:docs/p3-6a-readiness-acceptance
