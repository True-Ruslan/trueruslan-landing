name: Apply Work with me durable state

on:
  push:
    branches:
      - docs/work-with-me-production-acceptance
    paths:
      - '.github/workflows/apply-work-with-me-durable-state.yml'
      - 'scripts/apply-work-with-me-durable-state.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: work-with-me-durable-state
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'True-Ruslan/trueruslan-landing'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: docs/work-with-me-production-acceptance
          fetch-depth: 0
      - name: Apply bounded durable-state migration
        run: node scripts/apply-work-with-me-durable-state.js
      - name: Verify exact file scope
        shell: bash
        run: |
          set -euo pipefail
          CHANGED="$(git diff --name-only)"
          printf '%s\n' "$CHANGED"
          test -n "$CHANGED"
          test "$(printf '%s\n' "$CHANGED" | sort)" = "$(printf '%s\n' docs/CHANGELOG.md docs/PROJECT_STATE.md docs/ROADMAP.md | sort)"
      - name: Commit durable acceptance
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PROJECT_STATE.md docs/ROADMAP.md docs/CHANGELOG.md
          git commit -m 'docs: record Work with me exact production evidence'
          git push origin HEAD:docs/work-with-me-production-acceptance
