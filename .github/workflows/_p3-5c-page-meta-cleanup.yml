name: Temporary P3.5C page-meta cleanup

on:
  push:
    branches:
      - feat/p3-5c-english-publications
    paths:
      - scripts/_p3-5c-page-meta-cleanup.mjs
      - .github/workflows/_p3-5c-page-meta-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/p3-5c-english-publications
          fetch-depth: 1
      - name: Fetch master formatting source
        run: git fetch origin master --depth=1
      - name: Restore exact master formatting and add only EN Publications metadata
        run: node scripts/_p3-5c-page-meta-cleanup.mjs
      - name: Commit cleanup and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/page-meta.json scripts/_p3-5c-page-meta-cleanup.mjs .github/workflows/_p3-5c-page-meta-cleanup.yml
          git diff --cached --check
          git commit -m 'chore: remove unrelated page-meta formatting churn'
          git push origin HEAD:feat/p3-5c-english-publications
