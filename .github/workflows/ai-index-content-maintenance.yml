name: AI Index Content Maintenance

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [edited]
  workflow_run:
    workflows: [Build]
    types: [completed]

permissions:
  contents: read

jobs:
  workflow_run_gate:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      pull-requests: read
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      pr_number: ${{ steps.gate.outputs.pr_number }}
      candidate_sha: ${{ steps.gate.outputs.candidate_sha }}
    steps:
      - name: Authorize exact owner PR from completed Build metadata
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          WORKFLOW_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          echo "authorized=false" >> "$GITHUB_OUTPUT"

          if [ "$WORKFLOW_EVENT" != "pull_request" ]; then
            echo "Completed Build was not a pull_request run; maintenance remains unauthorized."
            exit 0
          fi
          if [ "$WORKFLOW_HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "Completed Build head repository is not the current repository."
            exit 0
          fi
          if ! [[ "$WORKFLOW_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Completed Build head SHA is not a canonical 40-hex commit."
            exit 0
          fi
          if [ -z "$WORKFLOW_HEAD_BRANCH" ]; then
            echo "Completed Build head branch is empty."
            exit 0
          fi

          PR_LIST="$(
            gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
              -f state=open \
              -f head="$REPOSITORY_OWNER:$WORKFLOW_HEAD_BRANCH"
          )"
          PR_COUNT="$(jq 'length' <<< "$PR_LIST")"
          if [ "$PR_COUNT" -ne 1 ]; then
            echo "Completed Build head branch must resolve to exactly one open pull request."
            exit 0
          fi

          PR_JSON="$(jq '.[0]' <<< "$PR_LIST")"
          WORKFLOW_PR_NUMBER="$(jq -r '.number' <<< "$PR_JSON")"
          PR_STATE="$(jq -r '.state' <<< "$PR_JSON")"
          PR_AUTHOR="$(jq -r '.user.login' <<< "$PR_JSON")"
          HEAD_SHA="$(jq -r '.head.sha' <<< "$PR_JSON")"
          HEAD_REPO="$(jq -r '.head.repo.full_name' <<< "$PR_JSON")"
          PR_BODY="$(jq -r '.body // ""' <<< "$PR_JSON")"

          if ! [[ "$WORKFLOW_PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "Resolved pull request number is invalid."
            exit 0
          fi
          if [ "$PR_STATE" != "open" ] || [ "$PR_AUTHOR" != "$REPOSITORY_OWNER" ]; then
            echo "Completed Build does not belong to an open repository-owner PR."
            exit 0
          fi
          if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ] || [ "$HEAD_SHA" != "$WORKFLOW_HEAD_SHA" ]; then
            echo "Completed Build is stale or its current PR head is outside the repository."
            exit 0
          fi

          read -r COMMAND REQUESTED_SHA CONFIRMATION EXTRA <<< "$PR_BODY"
          if [ "$COMMAND" != "/refresh-ai-index" ] || [ -n "${EXTRA:-}" ]; then
            echo "Owner PR does not carry an exact AI-index maintenance command."
            exit 0
          fi
          if ! [[ "$REQUESTED_SHA" =~ ^[a-f0-9]{40}$ ]] || [ "$REQUESTED_SHA" != "$HEAD_SHA" ]; then
            echo "Owner PR maintenance command is not bound to the current exact head."
            exit 0
          fi
          if [ "$CONFIRMATION" != "CONFIRM_OPENROUTER_REAL_EMBEDDING_RUN" ]; then
            echo "Owner PR does not carry explicit provider-spend confirmation."
            exit 0
          fi

          echo "pr_number=$WORKFLOW_PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "authorized=true" >> "$GITHUB_OUTPUT"

  receipt:
    needs: workflow_run_gate
    if: >-
      always() && (
        (github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          github.event.comment.author_association == 'OWNER' &&
          startsWith(github.event.comment.body, '/refresh-ai-index ')) ||
        (github.event_name == 'pull_request_target' &&
          github.event.pull_request.user.login == github.repository_owner &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.event.pull_request.body, '/refresh-ai-index ')) ||
        (github.event_name == 'workflow_run' &&
          needs.workflow_run_gate.result == 'success' &&
          needs.workflow_run_gate.outputs.authorized == 'true')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      pull-requests: write
    steps:
      - name: Publish sanitized maintenance receipt
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event_name == 'issue_comment' && github.event.issue.number || github.event.pull_request.number || needs.workflow_run_gate.outputs.pr_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          BODY="AI index content maintenance: **received**. Run: ${RUN_URL}. Command validation and provider execution are not complete."
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" -f body="$BODY" >/dev/null

  maintenance:
    needs: workflow_run_gate
    if: >-
      always() && (
        (github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          github.event.comment.author_association == 'OWNER' &&
          startsWith(github.event.comment.body, '/refresh-ai-index ')) ||
        (github.event_name == 'pull_request_target' &&
          github.event.pull_request.user.login == github.repository_owner &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.event.pull_request.body, '/refresh-ai-index ')) ||
        (github.event_name == 'workflow_run' &&
          needs.workflow_run_gate.result == 'success' &&
          needs.workflow_run_gate.outputs.authorized == 'true')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ai5-provider-acceptance
    concurrency:
      group: ai-index-content-maintenance-${{ github.event_name == 'issue_comment' && github.event.issue.number || github.event.pull_request.number || needs.workflow_run_gate.outputs.pr_number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr_number: ${{ github.event_name == 'issue_comment' && github.event.issue.number || github.event.pull_request.number || needs.workflow_run_gate.outputs.pr_number }}
      candidate_sha: ${{ steps.candidate.outputs.sha }}
      deduplicated: ${{ steps.dedupe.outputs.deduplicated }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Resolve exact candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_BODY: ${{ github.event_name == 'issue_comment' && github.event.comment.body || github.event.pull_request.body || '' }}
          ISSUE_NUMBER: ${{ github.event_name == 'issue_comment' && github.event.issue.number || github.event.pull_request.number || needs.workflow_run_gate.outputs.pr_number }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
          GATED_CANDIDATE_SHA: ${{ needs.workflow_run_gate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          if ! [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Maintenance PR number is invalid."
            exit 1
          fi

          PR_JSON="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$ISSUE_NUMBER")"
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            COMMENT_BODY="$(jq -r '.body // ""' <<< "$PR_JSON")"
          fi

          read -r COMMAND REQUESTED_SHA CONFIRMATION EXTRA <<< "$COMMENT_BODY"
          if [ "$COMMAND" != "/refresh-ai-index" ] || [ -n "${EXTRA:-}" ]; then
            echo "::error::Expected exactly: /refresh-ai-index <40-hex-sha> CONFIRM_OPENROUTER_REAL_EMBEDDING_RUN"
            exit 1
          fi
          if ! [[ "$REQUESTED_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Requested candidate SHA must be exactly 40 lowercase hex characters."
            exit 1
          fi
          if [ "$CONFIRMATION" != "CONFIRM_OPENROUTER_REAL_EMBEDDING_RUN" ]; then
            echo "::error::Explicit provider-spend confirmation is required."
            exit 1
          fi

          HEAD_SHA="$(jq -r '.head.sha' <<< "$PR_JSON")"
          HEAD_REPO="$(jq -r '.head.repo.full_name' <<< "$PR_JSON")"
          if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::Candidate repository must equal current repository."
            exit 1
          fi
          if [ "$REQUESTED_SHA" != "$HEAD_SHA" ]; then
            echo "::error::Requested SHA must equal current PR head."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ] && {
            [ "$WORKFLOW_RUN_HEAD_SHA" != "$HEAD_SHA" ] || [ "$GATED_CANDIDATE_SHA" != "$HEAD_SHA" ];
          }; then
            echo "::error::Workflow-run candidate authority no longer matches the current PR head."
            exit 1
          fi

          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$ISSUE_NUMBER/files?per_page=100" --jq '.[].filename' > "$RUNNER_TEMP/candidate-files.txt"
          FILE_COUNT="$(wc -l < "$RUNNER_TEMP/candidate-files.txt" | tr -d ' ')"
          if [ "$FILE_COUNT" -lt 1 ] || [ "$FILE_COUNT" -gt 100 ]; then
            echo "::error::AI content maintenance requires between 1 and 100 changed PR files."
            exit 1
          fi

          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Recheck existing successful maintenance
        id: dedupe
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event_name == 'issue_comment' && github.event.issue.number || github.event.pull_request.number || needs.workflow_run_gate.outputs.pr_number }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          MATCH_COUNT="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" \
              | jq -s --arg sha "$CANDIDATE_SHA" '
                  [
                    .[][] |
                    select(
                      .user.login == "github-actions[bot]" and
                      (.body | startswith("AI index content maintenance: **success**. Candidate: `" + $sha + "`. Run:"))
                    )
                  ] | length
                '
          )"
          if [ "$MATCH_COUNT" -gt 0 ]; then
            echo "deduplicated=true" >> "$GITHUB_OUTPUT"
            echo "Existing successful bot-authored maintenance evidence found for exact candidate; provider work will be skipped."
          else
            echo "deduplicated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout trusted workflow commit
        if: steps.dedupe.outputs.deduplicated != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact candidate
        if: steps.dedupe.outputs.deduplicated != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          path: candidate
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node.js
        if: steps.dedupe.outputs.deduplicated != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Reject executable or authority changes
        if: steps.dedupe.outputs.deduplicated != 'true'
        run: |
          set -euo pipefail
          # Content maintenance is fail-closed. Authority-bearing examples such as
          # scripts/*.js, .github/*, package-lock.json and data/ai-navigator.json
          # are intentionally excluded from this allowlist. data/publications.json
          # and data/sources.json are schema-validated content registries (see
          # scripts/publication-registry.js and scripts/sources-registry.js) with
          # no executable surface, so they are allowed as corpus inputs.
          while IFS= read -r changed; do
            case "$changed" in
              docs/*|scripts/*.test.js|tests/*|data/publications.json|data/sources.json)
                ;;
              *)
                echo "::error::AI maintenance refuses non-content candidate: $changed"
                exit 1
                ;;
            esac
          done < "$RUNNER_TEMP/candidate-files.txt"

          if find candidate/docs candidate/data -type l -print -quit | grep -q .; then
            echo "::error::AI maintenance refuses symlinked corpus inputs."
            exit 1
          fi

          rm -rf candidate/scripts
          cp -a trusted/scripts candidate/scripts
          cp trusted/data/ai-navigator.json candidate/data/ai-navigator.json
          rm -rf candidate/data/ai-index
          cp -a trusted/data/ai-index-accepted/ai5 candidate/data/ai-index

      - name: Refresh bounded changed chunks
        if: steps.dedupe.outputs.deduplicated != 'true'
        working-directory: candidate
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_AI5_API_KEY }}
          SOURCE_COMMIT: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {buildAiCorpus} from './scripts/ai-corpus.js';
          import {loadAiConfig} from './scripts/ai-config.js';
          import {refreshAiIndex} from './scripts/ai-index.js';
          import {createEmbeddingAccountingFetch, fetchCurrentKeyMetadata} from './scripts/ai5-provider-acceptance.js';

          const sourceCommit = process.env.SOURCE_COMMIT;
          if (!/^[a-f0-9]{40}$/.test(sourceCommit || '')) throw new Error('maintenance source commit is invalid');
          const apiKey = process.env.OPENROUTER_API_KEY;
          if (!apiKey) throw new Error('maintenance provider key is unavailable');

          const rootDir = process.cwd();
          const config = loadAiConfig(path.join(rootDir, 'data', 'ai-navigator.json'));
          const baselineMeta = JSON.parse(fs.readFileSync(path.join(rootDir, 'data', 'ai-index', 'index-meta.json'), 'utf8'));
          const chunks = buildAiCorpus({rootDir, config});
          const changed = chunks.filter(({id, contentHash}) => baselineMeta.contentHashes?.[id] !== contentHash);
          if (changed.length < 1 || changed.length > 8) {
            throw new Error(`maintenance changed-chunk budget requires 1..8 chunks; got ${changed.length}`);
          }

          const before = await fetchCurrentKeyMetadata({apiKey});
          const accounting = createEmbeddingAccountingFetch();
          const refreshed = await refreshAiIndex({
            rootDir,
            config,
            apiKey,
            fetchImpl: accounting.fetch,
            sourceCommit,
          });
          if (refreshed.refreshed !== changed.length || refreshed.refreshed > 8) {
            throw new Error(`maintenance refresh accounting mismatch: expected ${changed.length}, got ${refreshed.refreshed}`);
          }
          const after = await fetchCurrentKeyMetadata({apiKey});
          if (after.limitUsd !== before.limitUsd || after.limitReset !== null || before.limitReset !== null) {
            throw new Error('provider key policy changed during maintenance');
          }
          if (after.usageUsd + 1e-9 < before.usageUsd) {
            throw new Error('provider usage moved backwards during maintenance');
          }
          const runUsageDeltaUsd = Number((after.usageUsd - before.usageUsd).toFixed(12));
          const evidence = {
            schemaVersion: 1,
            evidenceClass: 'real-provider-index-maintenance',
            sourceCommit,
            publicAiMode: config.mode,
            keyPolicy: {
              configuredLimitUsd: after.limitUsd,
              lifetimeNoReset: after.limitReset === null,
            },
            keyAccounting: {
              beforeUsageUsd: before.usageUsd,
              afterUsageUsd: after.usageUsd,
              runUsageDeltaUsd,
            },
            changedChunkCount: changed.length,
            candidateIndex: refreshed,
            provider: accounting.report(),
          };
          fs.mkdirSync('quality-artifacts', {recursive: true});
          fs.writeFileSync('quality-artifacts/ai-index-maintenance-provider.json', `${JSON.stringify(evidence, null, 2)}\n`);
          process.stdout.write(`${JSON.stringify({sourceCommit, changedChunkCount: changed.length, candidateIndex: refreshed}, null, 2)}\n`);
          NODE

      - name: Offline verify refreshed candidate
        if: steps.dedupe.outputs.deduplicated != 'true'
        working-directory: candidate
        run: |
          set -euo pipefail
          test -z "${OPENROUTER_API_KEY:-}"
          node scripts/ai-index-verify.js | tee quality-artifacts/ai-index-maintenance-verify.json
          grep -q '"providerAccess": false' quality-artifacts/ai-index-maintenance-verify.json

      - name: Upload candidate index evidence
        id: upload
        if: steps.dedupe.outputs.deduplicated != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ai-index-content-maintenance-${{ github.event_name == 'issue_comment' && github.event.issue.number || github.event.pull_request.number || needs.workflow_run_gate.outputs.pr_number }}-${{ github.run_id }}
          path: |
            candidate/data/ai-index/chunks.json
            candidate/data/ai-index/index-meta.json
            candidate/data/ai-index/embeddings.bin
            candidate/quality-artifacts/ai-index-maintenance-provider.json
            candidate/quality-artifacts/ai-index-maintenance-verify.json
          if-no-files-found: error
          retention-days: 1

  report:
    if: ${{ always() && needs.maintenance.result != 'skipped' }}
    needs: maintenance
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      pull-requests: write
    steps:
      - name: Publish sanitized maintenance result
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.maintenance.outputs.pr_number }}
          RESULT: ${{ needs.maintenance.result }}
          CANDIDATE_SHA: ${{ needs.maintenance.outputs.candidate_sha }}
          DEDUPLICATED: ${{ needs.maintenance.outputs.deduplicated }}
          ARTIFACT_ID: ${{ needs.maintenance.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.maintenance.outputs.artifact_digest }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if ! [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Maintenance result has no valid PR number."
            exit 1
          fi
          if [ "$DEDUPLICATED" = "true" ]; then
            BODY="AI index content maintenance: **success-deduplicated**. Candidate: \`${CANDIDATE_SHA:-unresolved}\`. Run: ${RUN_URL}. Existing successful bot-authored maintenance evidence already exists; provider was not called."
          elif [ "$RESULT" = "success" ]; then
            if ! [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]; then
              echo "::error::Successful maintenance must expose a numeric artifact ID."
              exit 1
            fi
            if ! [[ "$ARTIFACT_DIGEST" =~ ^[a-f0-9]{64}$ ]]; then
              echo "::error::Successful maintenance must expose a SHA-256 artifact digest."
              exit 1
            fi
            BODY="AI index content maintenance: **success**. Candidate: \`${CANDIDATE_SHA}\`. Run: ${RUN_URL}. Artifact: ${ARTIFACT_ID}; sha256:${ARTIFACT_DIGEST}."
          else
            BODY="AI index content maintenance: **${RESULT}**. Candidate: \`${CANDIDATE_SHA:-unresolved}\`. Run: ${RUN_URL}."
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" -f body="$BODY" >/dev/null
