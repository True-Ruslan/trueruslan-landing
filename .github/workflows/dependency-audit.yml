name: Dependency Audit Evidence

on:
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/dependency-audit.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/dependency-audit-report.js'
      - 'scripts/dependency-audit-report.test.js'

permissions:
  contents: read

concurrency:
  group: dependency-audit-evidence-${{ github.event.pull_request.number || 'maintenance' }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install exact lockfile
        run: npm ci

      - name: Generate dependency audit evidence
        run: node scripts/dependency-audit-report.js --output-dir quality-artifacts

      - name: Upload dependency audit evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-audit-report
          path: |
            quality-artifacts/npm-audit-raw.json
            quality-artifacts/dependency-audit-report.json
            quality-artifacts/dependency-audit-report.md
          if-no-files-found: error
          retention-days: 30
