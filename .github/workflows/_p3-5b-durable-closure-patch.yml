name: Temporary P3.5B durable closure patch

on:
  push:
    branches:
      - docs/p3-5b-durable-closure
    paths:
      - scripts/_p3-5b-durable-closure-patch.mjs
      - .github/workflows/_p3-5b-durable-closure-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: docs/p3-5b-durable-closure
          fetch-depth: 1
      - name: Apply deterministic durable-state patch
        run: node scripts/_p3-5b-durable-closure-patch.mjs
      - name: Commit durable state and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ROADMAP.md docs/PROJECT_STATE.md docs/CHANGELOG.md docs/keystone/specs/2026-08-05-portfolio-1-0-evidence-first.md scripts/_p3-5b-durable-closure-patch.mjs .github/workflows/_p3-5b-durable-closure-patch.yml
          git diff --cached --check
          git commit -m 'docs: record P3.5B exact production acceptance'
          git push origin HEAD:docs/p3-5b-durable-closure
