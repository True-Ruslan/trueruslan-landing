name: Materialize accepted AI index once

on:
  push:
    branches: ["feat/ai6-durable-index"]

permissions:
  actions: read
  contents: write

concurrency:
  group: ai-index-materialize-once
  cancel-in-progress: false

jobs:
  materialize:
    if: github.repository == 'True-Ruslan/trueruslan-landing'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/ai6-durable-index
          persist-credentials: true

      - name: Download exact accepted AI-5 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/True-Ruslan/trueruslan-landing/actions/artifacts/9283608793/zip" \
            --output /tmp/accepted-ai5.zip
          echo "71260072c273588c4b8a4ab53180b6dfc5c39be8612aee21f91721c7d2919e1f  /tmp/accepted-ai5.zip" | sha256sum --check --strict

      - name: Materialize only production index bytes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/accepted-ai5 data/ai-index-accepted/ai5
          mkdir -p /tmp/accepted-ai5 data/ai-index-accepted/ai5
          unzip -q /tmp/accepted-ai5.zip -d /tmp/accepted-ai5
          install -m 0644 /tmp/accepted-ai5/data/ai-index/chunks.json data/ai-index-accepted/ai5/chunks.json
          install -m 0644 /tmp/accepted-ai5/data/ai-index/index-meta.json data/ai-index-accepted/ai5/index-meta.json
          install -m 0644 /tmp/accepted-ai5/data/ai-index/embeddings.bin data/ai-index-accepted/ai5/embeddings.bin
          echo "1249ed898193d1a05bda632b1328a860909887a1700092ba38e612ac7e6ac17a  data/ai-index-accepted/ai5/chunks.json" | sha256sum --check --strict
          echo "ad301d88071b2a57fe68df07cd98cdd9596ecc1ccc832453fc692af4d92f718d  data/ai-index-accepted/ai5/index-meta.json" | sha256sum --check --strict
          echo "aaf2c7ba86a53f0ff040e63c2c75decbf538a84d6c54c1da0e44f124b199510a  data/ai-index-accepted/ai5/embeddings.bin" | sha256sum --check --strict

      - name: Commit durable bytes and remove migration workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ai-index-accepted/ai5/chunks.json data/ai-index-accepted/ai5/index-meta.json data/ai-index-accepted/ai5/embeddings.bin
          git rm .github/workflows/ai-index-materialize-once.yml
          git commit -m "chore(ai): materialize exact accepted index"
          git push origin HEAD:feat/ai6-durable-index
