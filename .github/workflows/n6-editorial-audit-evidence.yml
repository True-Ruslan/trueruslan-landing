name: N6 Editorial Audit Evidence

on:
  pull_request:
    paths:
      - 'scripts/editorial-ux-audit/**'
      - 'scripts/editorial-ux-audit*.test.js'
      - 'scripts/editorial-ux-audit-built-site.integration.js'
      - 'docs/superpowers/specs/2026-08-13-full-site-editorial-ux-qa-design.md'
      - 'docs/superpowers/plans/2026-08-13-full-site-editorial-ux-qa-implementation.md'
      - '.github/workflows/n6-editorial-audit-evidence.yml'

permissions:
  contents: read

concurrency:
  group: n6-editorial-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build production-like site
        run: SITE_URL=https://trueruslan.ru npm run build:docs
      - name: Inspect representative generated content root
        run: |
          echo '--- structural tags ---'
          grep -oE '<(main|article|div|section)[^>]*(class|id)="[^"]+"[^>]*>' docs-html/projects/index.html | head -n 80 || true
          echo '--- h1 context ---'
          grep -oE '.{0,500}<h1[^>]*>.{0,900}' docs-html/projects/index.html | head -c 3000 || true
          echo
      - name: Generate editorial UX evidence
        run: node --test scripts/editorial-ux-audit-built-site.integration.js
      - name: Upload editorial UX evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.2.0
        with:
          name: n6-editorial-ux-audit
          path: |
            quality-artifacts/editorial-ux-audit.json
            quality-artifacts/editorial-ux-audit.md
          if-no-files-found: error
          retention-days: 14
