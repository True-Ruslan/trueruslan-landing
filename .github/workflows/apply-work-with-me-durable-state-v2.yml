name: Apply Work with me durable state v2

on:
  push:
    branches:
      - docs/work-with-me-production-acceptance
    paths:
      - '.github/workflows/apply-work-with-me-durable-state-v2.yml'
      - 'scripts/apply-work-with-me-durable-state-v2.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: work-with-me-durable-state-v2
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'True-Ruslan/trueruslan-landing'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: docs/work-with-me-production-acceptance
          fetch-depth: 0
      - name: Apply bounded durable-state migration
        run: node scripts/apply-work-with-me-durable-state-v2.js
      - name: Remove temporary migration machinery
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            scripts/apply-work-with-me-durable-state.js \
            scripts/apply-work-with-me-durable-state-v2.js \
            .github/workflows/apply-work-with-me-durable-state.yml \
            .github/workflows/apply-work-with-me-durable-state-v2.yml
      - name: Verify exact final scope
        shell: bash
        run: |
          set -euo pipefail
          CHANGED="$(git diff --name-only)"
          printf '%s\n' "$CHANGED"
          EXPECTED="$(printf '%s\n' \
            docs/CHANGELOG.md \
            docs/PROJECT_STATE.md \
            docs/ROADMAP.md \
            scripts/apply-work-with-me-durable-state.js \
            scripts/apply-work-with-me-durable-state-v2.js \
            .github/workflows/apply-work-with-me-durable-state.yml \
            .github/workflows/apply-work-with-me-durable-state-v2.yml | sort)"
          test "$(printf '%s\n' "$CHANGED" | sort)" = "$EXPECTED"
      - name: Commit durable acceptance and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: record Work with me exact production evidence'
          git push origin HEAD:docs/work-with-me-production-acceptance
