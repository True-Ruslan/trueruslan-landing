name: Temporary Lockfile Refresh

on:
  push:
    branches:
      - security/remediate-high-audit-families
    paths:
      - '.github/workflows/temporary-lockfile-refresh.yml'
      - 'package.json'

permissions:
  contents: write

concurrency:
  group: temporary-lockfile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: security/remediate-high-audit-families
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Refresh exact lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit generated lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json is already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'build: refresh high-severity remediation lockfile'
          git push origin HEAD:security/remediate-high-audit-families
