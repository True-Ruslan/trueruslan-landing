name: Temporary P3.5B production workflow patch

on:
  push:
    branches:
      - feat/p3-5b-english-now
    paths:
      - scripts/_p3-5b-production-workflow-patch.mjs
      - .github/workflows/_p3-5b-production-workflow-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/p3-5b-english-now
          fetch-depth: 1
      - name: Apply deterministic workflow patch
        run: node scripts/_p3-5b-production-workflow-patch.mjs
      - name: Commit production workflow and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/production-live.yml scripts/_p3-5b-production-workflow-patch.mjs .github/workflows/_p3-5b-production-workflow-patch.yml
          git diff --cached --check
          git commit -m 'test: wire P3.5B exact-deployment smoke'
          git push origin HEAD:feat/p3-5b-english-now
