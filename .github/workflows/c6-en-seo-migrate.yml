name: C6 EN SEO migration

on:
  push:
    branches:
      - feat/portfolio-clarity-c6-en-seo
    paths:
      - .github/workflows/c6-en-seo-migrate.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/portfolio-clarity-c6-en-seo
          fetch-depth: 1

      - name: Apply fail-closed C6 migration
        run: |
          set -euo pipefail
          python3 scripts/migrate-c6-en-seo.py
          git diff --check

      - name: Commit C6 source changes
        run: |
          set -euo pipefail
          git rm scripts/migrate-c6-en-seo.py
          git add data/page-meta.json docs/en/about.md docs/en/now.md docs/en/projects.md docs/en/resume.md scripts/copy-assets.js scripts/copy-assets.test.js scripts/i18n-browser-smoke.cjs scripts/metadata-smoke.cjs scripts/portfolio-clarity-c6.test.js scripts/seo.js scripts/seo.test.js
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: reconcile C6 English and SEO surfaces'
          git push origin HEAD:feat/portfolio-clarity-c6-en-seo
