name: Run rollout docs patcher

on:
  push:
    branches:
      - docs/close-canonical-link-rollout

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/close-canonical-link-rollout
          fetch-depth: 0
      - name: Apply and verify
        run: python scripts/_close_rollout_docs.py
      - name: Remove temporary files and commit
        run: |
          rm -f scripts/_close_rollout_docs.py
          rm -f .github/workflows/_close-canonical-link-rollout.yml
          rm -f .github/workflows/_close-canonical-link-rollout-2.yml
          rm -f .github/workflows/_run-close-rollout-docs.yml
          rm -f .closure-trigger .closure-trigger-2 .closure-trigger-3
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: close canonical link rollout'
          git push origin HEAD:docs/close-canonical-link-rollout
