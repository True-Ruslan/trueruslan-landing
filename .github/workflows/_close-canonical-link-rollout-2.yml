name: Finalize canonical link rollout docs

on:
  push:
    branches:
      - docs/close-canonical-link-rollout

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/close-canonical-link-rollout
          fetch-depth: 0
      - name: Update canonical state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          state = Path('docs/PROJECT_STATE.md')
          s = state.read_text(encoding='utf-8')
          s = s.replace(
              '> Последнее смысловое обновление: **2026-08-01**, после успешного P2.3b HTTPS Production Cutover на `https://trueruslan.ru`.',
              '> Последнее смысловое обновление: **2026-08-01**, после завершения P2.4a canonical-link rollout и подтверждения первой Cloudflare telemetry для `https://trueruslan.ru`.',
          )
          if '### P2.4a — Canonical link rollout and first custom-host telemetry — DONE' not in s:
              marker = '## 2. Последний завершённый milestone\n\n### P2.3b — HTTPS Production Cutover — DONE'
              block = '''## 2. Последние завершённые operational milestones

