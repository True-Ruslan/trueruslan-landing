name: C5 durable acceptance migration

on:
  push:
    branches:
      - docs/portfolio-clarity-c5-durable-acceptance
    paths:
      - .github/workflows/c5-durable-acceptance-migrate.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/portfolio-clarity-c5-durable-acceptance
          fetch-depth: 1

      - name: Apply fail-closed durable migration
        run: |
          set -euo pipefail
          python3 scripts/migrate-c5-durable-acceptance.py
          git diff --check

      - name: Commit durable state only
        run: |
          set -euo pipefail
          git rm scripts/migrate-c5-durable-acceptance.py
          git add docs/PROJECT_STATE.md docs/ROADMAP.md docs/CHANGELOG.md docs/acceptance/2026-08-11-portfolio-clarity-c5.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: record C5 production acceptance'
          git push origin HEAD:docs/portfolio-clarity-c5-durable-acceptance
