name: C1 acceptance migration

on:
  push:
    branches:
      - docs/portfolio-clarity-c1-production-acceptance
    paths:
      - .github/workflows/c1-acceptance-migration.yml
      - scripts/c1-acceptance-migration.mjs

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/portfolio-clarity-c1-production-acceptance
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/c1-acceptance-migration.mjs
      - run: npm test
      - run: rm scripts/c1-acceptance-migration.mjs .github/workflows/c1-acceptance-migration.yml
      - name: Commit durable acceptance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 1
          git commit -m "docs: record C1 production acceptance"
          git push origin HEAD:docs/portfolio-clarity-c1-production-acceptance
