name: AI-6 docs reconciliation once

on:
  push:
    branches:
      - docs/ai6-production-acceptance

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Reconcile accepted AI-6 production state
        run: python3 scripts/reconcile-ai6-docs.py
      - name: Verify and commit reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- docs/PROJECT_STATE.md docs/ROADMAP.md docs/CHANGELOG.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PROJECT_STATE.md docs/ROADMAP.md docs/CHANGELOG.md
          git rm .github/workflows/docs-ai6-reconcile-once.yml scripts/reconcile-ai6-docs.py
          git commit -m 'docs(ai): record accepted public SEARCH baseline'
          git push origin HEAD:docs/ai6-production-acceptance
