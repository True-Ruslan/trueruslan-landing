name: AI-6 docs reconciliation once

on:
  push:
    branches:
      - docs/ai6-production-acceptance

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Reconcile accepted AI-6 production state
        shell: bash
        run: |
          set -euo pipefail
          expected_base='3809d6f0290ab22f080e919f2ff26b1b018f3db6'
          actual_base="$(git rev-parse HEAD^)"
          test "$actual_base" = "$expected_base"

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return text.replace(old, new, 1)

          state_path = Path('docs/PROJECT_STATE.md')
          state = state_path.read_text()
          state = replace_once(
              state,
              '> Последнее смысловое обновление: **2026-08-16**. Current production baseline accepted на exact deployed SHA `d5a67a9787637ee8cc63bdc0ac7a8330ca9ef6d8`; AI Navigator engineering baseline остаётся production-accepted, публичный AI остаётся **OFF**. Controlled launch остаётся `not-published`; P4.1B real external evidence review — IN PROGRESS / SPARSE PRE-LAUNCH BASELINE; P4.1C — WAITING; P3.6 — Measurement checkpoint — NEXT / WAITING FOR EXTERNAL EVIDENCE.',
              '> Последнее смысловое обновление: **2026-08-18**. AI-6 public SEARCH production acceptance — **ACCEPTED** on exact runtime SHA `3809d6f0290ab22f080e919f2ff26b1b018f3db6`; canonical manual run `32148448724` passed with one successful `/v1/embed` request, a semantic result, `/v1/answer` disabled and zero unexpected external requests. Controlled launch остаётся `not-published`; P4.1B real external evidence review — IN PROGRESS / SPARSE PRE-LAUNCH BASELINE; P4.1C — WAITING; P3.6 — Measurement checkpoint — NEXT / WAITING FOR EXTERNAL EVIDENCE.',
              'PROJECT_STATE header',
          )
          state = replace_once(
              state,
              '''master / deployed SHA:            d5a67a9787637ee8cc63bdc0ac7a8330ca9ef6d8
Pages:                            #277 / 31968943858 — SUCCESS
Production Live Smoke:            #635 / 31968943881 — SUCCESS
master CodeQL:                    #1788 / 31968943873 — SUCCESS
deployed flagship normalization:  SUCCESS
AI Navigator production mode:     off
controlled launch:                not-published''',
              '''AI-6 accepted runtime SHA:         3809d6f0290ab22f080e919f2ff26b1b018f3db6
Pages:                            #293 / 32139175939 — SUCCESS
Production Live Smoke (push):     #671 / 32139176165 — SUCCESS
Production Live Smoke (post-Pages): #672 / 32139345457 — SUCCESS
master CodeQL:                    #1904 / 32139175988 — SUCCESS
AI Navigator production mode:     search
AI-6 public SEARCH acceptance:    #6 / 32148448724 — SUCCESS
controlled launch:                not-published''',
              'PROJECT_STATE baseline block',
          )
          state = replace_once(
              state,
              '## 2. AI Navigator — ENGINEERING BASELINE PRODUCTION ACCEPTED / PUBLIC AI OFF',
              '## 2. AI Navigator — PUBLIC SEARCH PRODUCTION ACCEPTED / FULL NOT ENABLED',
              'PROJECT_STATE AI heading',
          )
          state = replace_once(
              state,
              'Production config remains `mode=off`, `workerBaseUrl=""`. No live OpenRouter/provider acceptance, dedicated production key/spending cap, SEARCH/FULL canary or AI product-impact claim is implied.',
              '''AI-5 real-provider/index acceptance and AI-6 isolated SEARCH canary were completed before public activation. Public SEARCH was then activated through PR #275; late Diplodoc hydration/rebinding and production button ownership were corrected through PR #277, #279 and #281, while PR #278 preserved actionable failure diagnostics. PR #280 / issue #276 moved the accepted semantic index to a durable repository-owned source with exact SHA-256 verification and provider-free restore.

Production config is now `mode=search`. SEARCH remains explicit opt-in and ordinary Diplodoc search remains the fallback. Canonical manual acceptance run `32148448724` on exact SHA `3809d6f0290ab22f080e919f2ff26b1b018f3db6` recorded `embedRequests=1`, `POST /v1/embed` HTTP 200, `semanticOutcome=semantic-result`, first result `/notes/deployment-success-is-not-production-verification/`, `answerEndpointDisabled=true`, `answerActionAbsent=true` and `unexpectedExternalRequests=0`. Sanitized artifact `9328756080` has digest `sha256:d8d0d242c72e7ad4e122bb486ecded358b8e9b1f852f9928edb041c410b0d623`. `/v1/answer` remains disabled and AI-7/FULL is not active.''',
              'PROJECT_STATE AI status',
          )
          state = replace_once(
              state,
              '''Portfolio 1.0 presentation implementation is **COMPLETE THROUGH C7**.
Current bounded product/operator lane: P4.1B real external evidence review — **IN PROGRESS / SPARSE PRE-LAUNCH BASELINE**.
P3.6 remains **NEXT / WAITING FOR EXTERNAL EVIDENCE**.''',
              '''Portfolio 1.0 presentation implementation is **COMPLETE THROUGH C7**.
Current bounded product/operator lane: P4.1B real external evidence review — **IN PROGRESS / SPARSE PRE-LAUNCH BASELINE**.
AI engineering lane: AI-7 FULL canary + KEEP / DOWNGRADE / REMOVE verdict is now **PERMITTED / NEXT AS A SEPARATE CANARY**, but is not active.
P3.6 remains **NEXT / WAITING FOR EXTERNAL EVIDENCE**.''',
              'PROJECT_STATE next slice',
          )
          state = replace_once(
              state,
              '- AI real-provider/index acceptance still requires a dedicated hard-spend-capped OpenRouter key and explicit operator acceptance path.',
              '- issues #274 and #276 are CLOSED / COMPLETED; AI-6 SEARCH has no remaining activation/index-retention gate. AI-7/FULL still requires its own explicit canary and acceptance and must not be promoted automatically.',
              'PROJECT_STATE debt',
          )
          state = replace_once(
              state,
              'AI engineering: dedicated capped provider key → explicit real index/provider acceptance → SEARCH canary → FULL canary → KEEP / DOWNGRADE / REMOVE. Ordinary CI/build remains provider-free.',
              'AI engineering: AI-7 FULL canary → bounded grounded-answer acceptance → KEEP / DOWNGRADE / REMOVE. SEARCH remains the accepted production baseline until that separate verdict; ordinary CI/build remains provider-free.',
              'PROJECT_STATE next order',
          )
          state_path.write_text(state)

          roadmap_path = Path('docs/ROADMAP.md')
          roadmap = roadmap_path.read_text()
          roadmap = replace_once(
              roadmap,
              '> Обновлено: **2026-08-16**. Current production baseline accepted на `d5a67a9787637ee8cc63bdc0ac7a8330ca9ef6d8`; AI Navigator engineering baseline остаётся production-accepted, public AI остаётся OFF. Controlled launch — not-published; P4.1B real external evidence review — IN PROGRESS / SPARSE PRE-LAUNCH BASELINE; P4.1C — WAITING; P3.6 — Measurement checkpoint — NEXT / WAITING FOR EXTERNAL EVIDENCE.',
              '> Обновлено: **2026-08-18**. AI-6 public SEARCH is production-accepted on exact runtime SHA `3809d6f0290ab22f080e919f2ff26b1b018f3db6`; canonical manual acceptance run `32148448724` is SUCCESS. `/v1/answer` remains disabled and FULL is not active. Controlled launch — not-published; P4.1B real external evidence review — IN PROGRESS / SPARSE PRE-LAUNCH BASELINE; P4.1C — WAITING; P3.6 — Measurement checkpoint — NEXT / WAITING FOR EXTERNAL EVIDENCE.',
              'ROADMAP header',
          )
          roadmap = replace_once(
              roadmap,
              'AI Navigator #248–#253 is DONE / PRODUCTION ACCEPTED WITH PUBLIC MODE OFF. Current exact production SHA `d5a67a9787637ee8cc63bdc0ac7a8330ca9ef6d8`: Pages #277 / 31968943858, Production Live #635 / 31968943881, master CodeQL #1788 / 31968943873 — SUCCESS; deployed flagship normalization — SUCCESS.',
              'AI Navigator engineering baseline #248–#253 remains accepted; AI-5 real-provider/index acceptance and AI-6 SEARCH activation are now also DONE / PRODUCTION ACCEPTED. Exact accepted SEARCH runtime SHA `3809d6f0290ab22f080e919f2ff26b1b018f3db6`: Pages #293 / 32139175939, Production Live #671 / 32139176165, post-Pages Live #672 / 32139345457, master CodeQL #1904 / 32139175988 and canonical manual SEARCH acceptance #6 / 32148448724 — SUCCESS. Public mode is `search`; `/v1/answer` remains disabled; FULL is not active.',
              'ROADMAP accepted baseline',
          )
          roadmap = replace_once(
              roadmap,
              '''### AI-5 — real provider/index acceptance — NEXT
Use a dedicated hard-spend-capped OpenRouter key bound only to the explicit Worker/acceptance path; refresh real document embeddings, verify model/dimensions and static index deterministically, run offline benchmark, record provider latency/error/cost separately. Ordinary CI/build must remain provider-free.

### AI-6 — SEARCH canary — WAITING FOR AI-5
Enable only bounded `search` mode, preserve Diplodoc fallback, verify CORS/preflight/query embedding/static index/hybrid ranking/timeouts/failure behavior and measure quality/latency/spend.

### AI-7 — FULL canary + verdict — WAITING FOR SEARCH
Enable explicit Ask AI only after SEARCH acceptance; preserve canonical Worker grounding and strict citations; verify insufficient-evidence behavior; finish with KEEP / DOWNGRADE / REMOVE.''',
              '''### AI-5 — real provider/index acceptance — DONE / ACCEPTED
Dedicated bounded real-provider acceptance completed, including deterministic index verification and real-provider evidence; ordinary CI/build remains provider-free. The accepted index is now persisted durably in-repository with exact digest verification via PR #280 / issue #276.

### AI-6 — SEARCH canary + public activation — DONE / PRODUCTION ACCEPTED
Isolated SEARCH canary was accepted before public activation. Public `search` mode is now accepted on exact SHA `3809d6f0290ab22f080e919f2ff26b1b018f3db6`; canonical run `32148448724` proved a live `/v1/embed` request and semantic result while `/v1/answer` remained disabled, with zero unexpected external requests. Diplodoc fallback and exact rollback remain preserved. Issue #274 is CLOSED / COMPLETED.

### AI-7 — FULL canary + verdict — NEXT / SEPARATE CANARY
Enable explicit Ask AI only as a separate bounded stage after the accepted SEARCH baseline; preserve canonical Worker grounding and strict citations; verify insufficient-evidence behavior, latency/spend/failure boundaries and rollback; finish with KEEP / DOWNGRADE / REMOVE. No automatic promotion from SEARCH is allowed.''',
              'ROADMAP AI stages',
          )
          roadmap_path.write_text(roadmap)

          changelog_path = Path('docs/CHANGELOG.md')
          changelog = changelog_path.read_text()
          changelog = replace_once(
              changelog,
              '> Обновлено: **2026-08-15**. AI Navigator engineering baseline production-accepted на `ca4cecd510b5c0f6bad6cef31b6b5dd630f5f50f`; public AI остаётся OFF. Controlled launch remains not-published; P4.1B real external evidence review — IN PROGRESS / SPARSE PRE-LAUNCH BASELINE; P4.1C — WAITING; P3.6 — Measurement checkpoint — NEXT / WAITING FOR EXTERNAL EVIDENCE.',
              '> Обновлено: **2026-08-18**. AI-6 public SEARCH production acceptance — ACCEPTED on exact runtime SHA `3809d6f0290ab22f080e919f2ff26b1b018f3db6`; canonical manual run `32148448724` — SUCCESS. `/v1/answer` remains disabled; FULL is not active. Controlled launch remains not-published; P4.1B real external evidence review — IN PROGRESS / SPARSE PRE-LAUNCH BASELINE; P4.1C — WAITING; P3.6 — Measurement checkpoint — NEXT / WAITING FOR EXTERNAL EVIDENCE.',
              'CHANGELOG header',
          )
          marker = '## 2026-08-15 — AI Navigator static-first engineering baseline — PRODUCTION ACCEPTED / PUBLIC AI OFF'
          entry = '''## 2026-08-18 — AI-6 public semantic SEARCH — PRODUCTION ACCEPTED

- AI-5 real-provider/index acceptance was completed before public activation; accepted semantic index evidence was made durable and provider-free for restore through PR #280 / issue #276.
- AI-6 isolated SEARCH canary evidence was recorded through PR #273; public SEARCH activation followed in PR #275 while preserving opt-in behavior, ordinary Diplodoc fallback and `/v1/answer` disabled.
- Production-only integration defects were then removed without widening scope: PR #277 handled late search hydration, PR #278 preserved actionable acceptance diagnostics, PR #279 rebound SEARCH after Diplodoc DOM replacement, and PR #281 intercepted the live Diplodoc search-button click in capture phase only while AI is enabled.
- PR #281 TDD: RED Build #2346 / `32137532919` failed exactly on the two new button-click regressions; exact-head `2fcc31475d16fa9a07fb15d0a13cc363e785cd25` then passed Build #2349 / `32137885631`, Dependency Review #1713 / `32137885632` and CodeQL #1903 / `32137885722`, including AI Navigator browser smoke, Firefox/WebKit compatibility and visual regression.
- Merged SEARCH runtime SHA `3809d6f0290ab22f080e919f2ff26b1b018f3db6`: Pages #293 / `32139175939`, CodeQL #1904 / `32139175988`, Production Live Smoke #671 / `32139176165` and post-Pages #672 / `32139345457` — SUCCESS.
- Canonical manual `AI Navigator Public SEARCH Acceptance` #6 / `32148448724` — SUCCESS on the exact runtime SHA. Sanitized evidence recorded `embedRequests=1`, static index HTTP 200, `POST /v1/embed` HTTP 200, `semanticOutcome=semantic-result`, first result `/notes/deployment-success-is-not-production-verification/`, `answerEndpointDisabled=true`, `answerActionAbsent=true`, `unexpectedExternalRequests=0`. Artifact `9328756080`, digest `sha256:d8d0d242c72e7ad4e122bb486ecded358b8e9b1f852f9928edb041c410b0d623`.
- Issue #274 is CLOSED / COMPLETED. AI-6 SEARCH is the accepted public AI baseline. AI-7/FULL is now permitted as a separate canary but is not active.

'''
          changelog = replace_once(changelog, marker, entry + marker, 'CHANGELOG entry')
          changelog_path.write_text(changelog)
          PY

          git diff --check
          git diff -- docs/PROJECT_STATE.md docs/ROADMAP.md docs/CHANGELOG.md

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PROJECT_STATE.md docs/ROADMAP.md docs/CHANGELOG.md
          git rm .github/workflows/docs-ai6-reconcile-once.yml
          git commit -m 'docs(ai): record accepted public SEARCH baseline'
          git push origin HEAD:docs/ai6-production-acceptance
