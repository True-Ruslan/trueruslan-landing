name: C5 Notes build migration

on:
  push:
    branches:
      - feat/portfolio-clarity-c5-knowledge-surfaces
    paths:
      - .github/workflows/c5-notes-build-migrate.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/portfolio-clarity-c5-knowledge-surfaces
          fetch-depth: 1

      - name: Apply fail-closed build integration
        run: |
          set -euo pipefail
          python3 scripts/migrate-c5-notes-build.py
          git diff --check

      - name: Remove one-shot migration files
        run: |
          set -euo pipefail
          git rm scripts/migrate-c5-notes-build.py .github/workflows/c5-notes-build-migrate.yml

      - name: Commit build integration only
        run: |
          set -euo pipefail
          git add scripts/copy-assets.js
          git diff --cached --check
          git diff --cached --quiet && { echo 'ERROR: migration produced no staged changes'; exit 1; } || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: wire registry-derived Notes index into build'
          git push origin HEAD:feat/portfolio-clarity-c5-knowledge-surfaces
