name: One-shot Content Freshness schema fix

on:
  push:
    branches:
      - docs/content-freshness-reconcile-2026-08-11
    paths:
      - '.github/workflows/content-freshness-schema-fix.yml'
      - 'scripts/content-freshness-schema-fix.mjs'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: docs/content-freshness-reconcile-2026-08-11

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply fail-closed signal-mode correction
        run: node scripts/content-freshness-schema-fix.mjs

      - name: Prove evidence schema and reconciliation contract
        run: node --test scripts/project-evidence-canonical.test.js scripts/content-freshness-reconciliation-2026-08-11.test.js

      - name: Commit schema correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/project-evidence.json
          git diff --cached --quiet && { echo 'Schema correction produced no changes'; exit 1; }
          git commit -m "fix: normalize reconciled PR signal modes"
          git push origin HEAD:docs/content-freshness-reconcile-2026-08-11
