name: Generate low-risk security lockfile

on:
  pull_request:
    branches:
      - master
    paths:
      - package.json
      - scripts/dependency-security.test.js
      - .github/workflows/generate-low-risk-security-lockfile.yml

permissions:
  contents: write

concurrency:
  group: generate-low-risk-security-lockfile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.1.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.6.0
        with:
          node-version: '24'
          cache: npm

      - name: Resolve dependencies and regenerate lockfile
        run: npm install --ignore-scripts

      - name: Verify focused dependency security tests
        run: node --test scripts/dependency-security.test.js

      - name: Capture remediated dependency tree
        run: >-
          npm ls
          brace-expansion
          js-yaml
          katex
          lodash
          svgo
          sanitize-html
          uuid
          --all > dependency-tree.txt

      - name: Capture current audit inventory
        shell: bash
        run: npm audit --json > npm-audit.json || true

      - name: Summarize current audit inventory
        run: >-
          node --input-type=module -e
          "const a=JSON.parse(require('node:fs').readFileSync('npm-audit.json','utf8'));
          console.log(JSON.stringify(a.metadata?.vulnerabilities ?? {}, null, 2));"

      - name: Commit generated lockfile to the PR branch
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = 'package-lock.json';
            const {owner, repo} = context.repo;
            const branch = context.payload.pull_request.head.ref;
            const current = await github.rest.repos.getContent({owner, repo, path, ref: branch});
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              branch,
              sha: current.data.sha,
              message: 'deps: regenerate lockfile after low-risk remediations',
              content: fs.readFileSync(path).toString('base64'),
            });

      - name: Upload dependency security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: low-risk-dependency-security-evidence
          path: |
            package-lock.json
            dependency-tree.txt
            npm-audit.json
          if-no-files-found: error
          retention-days: 14
