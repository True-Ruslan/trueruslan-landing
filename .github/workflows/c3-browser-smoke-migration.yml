name: C3 browser smoke migration

on:
  push:
    branches:
      - feat/portfolio-clarity-c3-projects
    paths:
      - scripts/c3-browser-smoke-migration.mjs
      - .github/workflows/c3-browser-smoke-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout C3 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/portfolio-clarity-c3-projects

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Add C3 generated DOM acceptance
        run: node scripts/c3-browser-smoke-migration.mjs

      - name: Verify source wiring contract
        run: node --test scripts/portfolio-clarity-c3.test.js

      - name: Commit browser verifier and remove temporary migration files
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/c3-browser-smoke-migration.mjs .github/workflows/c3-browser-smoke-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/v03-browser-smoke.cjs scripts/c3-browser-smoke-migration.mjs .github/workflows/c3-browser-smoke-migration.yml
          git diff --cached --check
          git commit -m 'test: cover C3 generated project surfaces'
          git push origin HEAD:feat/portfolio-clarity-c3-projects
