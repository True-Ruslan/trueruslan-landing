name: Temporary P3.5C search fix

on:
  push:
    branches:
      - feat/p3-5c-english-publications

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p3-5c-english-publications
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic P3.5C search patch
        run: node scripts/temp-p3-5c-search-fix.cjs
      - name: Verify no unexpected changes
        run: |
          git status --short
          git diff --check
      - name: Commit patched acceptance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/search-smoke.cjs scripts/production-p3-5c-english-publications-smoke.cjs scripts/production-p3-5c-english-publications-smoke.test.js scripts/portfolio-p3-5c-english-publications.test.js
          git diff --cached --quiet && exit 1
          git commit -m "test: verify EN Publications through registry-derived search"
          git push origin HEAD:feat/p3-5c-english-publications
