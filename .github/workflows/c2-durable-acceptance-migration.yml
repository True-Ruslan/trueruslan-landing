name: C2 durable acceptance migration

on:
  push:
    branches:
      - docs/portfolio-clarity-c2-production-acceptance
    paths:
      - '.github/workflows/c2-durable-acceptance-migration.yml'
      - 'scripts/c2-durable-acceptance-migration.mjs'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: docs/portfolio-clarity-c2-production-acceptance
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Apply durable migration
        run: node scripts/c2-durable-acceptance-migration.mjs
      - name: Commit durable state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: record C2 durable production acceptance'
          git push origin HEAD:docs/portfolio-clarity-c2-production-acceptance
