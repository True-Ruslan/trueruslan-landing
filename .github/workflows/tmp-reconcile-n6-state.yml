name: Temporary N6 state reconciliation

on:
  push:
    branches:
      - docs/reconcile-n6-state

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Apply bounded N6 reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace_exact(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              assert count == 1, f'{label}: expected exactly one old marker, found {count}'
              return text.replace(old, new, 1)

          def insert_after(text: str, anchor: str, section: str, marker: str, label: str) -> str:
              assert marker not in text, f'{label}: target section already present'
              count = text.count(anchor)
              assert count == 1, f'{label}: expected exactly one anchor, found {count}'
              return text.replace(anchor, anchor + section, 1)

          project_state = Path('docs/PROJECT_STATE.md')
          roadmap = Path('docs/ROADMAP.md')
          changelog = Path('docs/CHANGELOG.md')

          state = project_state.read_text()
          state = replace_exact(
              state,
              '> Последнее смысловое обновление: **2026-08-13**, Portfolio UX/content polish N2–N5 и Engineering Notes reader architecture #229 production-accepted на exact deployed SHA `1a0db35795aea1ea966e1452bcdb106bb5419ba1`; controlled launch остаётся `not-published`, P4.1B — IN PROGRESS / SPARSE PRE-LAUNCH BASELINE, P3.6/P4.1C — WAITING.',
              '> Последнее смысловое обновление: **2026-08-14**, N6 full-site editorial UX + bounded copy polish production-accepted на exact product SHA `635b4a0760765a515277ad8abcbb1500bf646027`; durable acceptance #236 production-verified на `01b4508355c33a81a5e9d1b5f5815a6c37318a9b`; controlled launch остаётся `not-published`, P4.1B — IN PROGRESS / SPARSE PRE-LAUNCH BASELINE, P3.6/P4.1C — WAITING.',
              'PROJECT_STATE header',
          )
          state_anchor = 'Repository readiness, generated artifact, deployed production, search-engine observation и external-product acceptance остаются разными фактами.\n\n'
          state_section = '''## 0.6 2026-08-14 — N6 full-site editorial UX + bounded copy polish — PRODUCTION ACCEPTED

N6 завершил полный editorial/reader-quality проход по сайту без повторного открытия site architecture, Onest typography, canonical URLs, navigation/search ownership, canonical registries, analytics или external search-evidence semantics.

### N6A audit + N6C bounded implementation

- **N6A full-site editorial UX audit — DONE / RESEARCH ACCEPTED** via PR #231 / squash `99af9cd2e9f31f124fb095cd2b7b2b23cc1e2a97`: 50/50 canonical routes resolved; Tier 1 = 14, Tier 2 = 18, Tier 3 = 18; final configured automated warnings = 0; Onest = KEEP; exactly 8 bounded copy corrections selected.
- **N6C editorial copy polish — DONE / PRODUCT ACCEPTED** via PR #233 / initial deployed SHA `ec4b0b7ead1117b2bb507e25e517400b36e771a1`: bounded RU Projects / Work with me / About / Materials / Publications / Notes hub plus EN Projects / About copy only. No typography, URL, registry, workflow, deep-case-study or deep-Note architecture change.
- The first two post-merge Production Live runs (#561 / `31731621136`, #562 / `31731693651`) exposed a **stale verifier contract**, not a production-content regression: RU no-JS had the accepted translated labels while `production-work-with-me-smoke.cjs` still required the old English token `Context` for both locales.
- **Verifier correction — DONE / PRODUCTION ACCEPTED** via PR #234. TDD RED commit `088dceaea3edba7dfc3115a499fc8af797d99379`: Build `31744750885` failed exactly one new regression contract (805 PASS / 1 intended FAIL). GREEN exact head `2f7ad5a11fef85e9d5e88028f6fba05674d4e637`: Build #2089 / `31744917904`, Dependency Review `31744917926`, CodeQL `31744917942` — SUCCESS with no new Advanced Security alerts.

### Exact production acceptance

```text
PR #234 squash / product SHA:    635b4a0760765a515277ad8abcbb1500bf646027
Pages:                           #255 / 31745658299 — SUCCESS
Pages deployment ID:             5896352977
Production Live push:            #564 / 31745658315 — SUCCESS
Production Live workflow_run:    #565 / 31745724350 — SUCCESS
master CodeQL:                   #1662 / 31745658298 — SUCCESS
quality artifact:                9198759058
quality digest:                  sha256:2802631b5c10fb2d8c8359801ad8ba15e8ab0a7a728aadab6445b55cfef15993
production artifact:             9198954485
production digest:               sha256:a30b2e8cb15b7b00ebd22dc2b18a8f2f9d0f1c2eb970006db6c6dff1ad750b4c
```

Deployment-triggered Production Live #565 passed the previously failing Work with me smoke together with P3.4A–F and favicon verification. Durable ledger: `docs/acceptance/2026-08-14-n6-editorial-production-acceptance.md`.

The durable acceptance itself was merged by PR #236 / `01b4508355c33a81a5e9d1b5f5815a6c37318a9b`; post-merge Pages #256 / `31747501445`, Production Live push #566 / `31747501412`, deployment-triggered Production Live #567 / `31747551462` and master CodeQL #1665 / `31747501461` are SUCCESS. PR #235 was closed as superseded; open PR count returned to zero.

N6 closes the selected editorial implementation sequence, not external product/search impact. **Controlled launch remains `not-published`; P4.1B remains IN PROGRESS / SPARSE PRE-LAUNCH BASELINE; P4.1C remains WAITING; P3.6 remains NEXT / WAITING FOR EXTERNAL EVIDENCE.** Clean-URL observation clock remains `2026-08-05T00:00:00Z`. No further unguided visual/SEO rewrite is justified before the already-prepared deliberate manual launch and subsequent real Search Console / Yandex Webmaster observations.

'''
          state = insert_after(state, state_anchor, state_section, '## 0.6 2026-08-14', 'PROJECT_STATE section')
          project_state.write_text(state)

          road = roadmap.read_text()
          road = replace_exact(
              road,
              '> Обновлено: **2026-08-13**, N2–N5 UX/content polish и Engineering Notes reader architecture #229 production-accepted; controlled launch остаётся `not-published`, P4.1B — IN PROGRESS / SPARSE PRE-LAUNCH BASELINE, P3.6/P4.1C остаются evidence-gated.',
              '> Обновлено: **2026-08-14**, N6 full-site editorial UX + bounded copy polish production-accepted; controlled launch остаётся `not-published`, P4.1B — IN PROGRESS / SPARSE PRE-LAUNCH BASELINE, P3.6/P4.1C остаются evidence-gated.',
              'ROADMAP header',
          )
          road_anchor = '> Current state — `docs/PROJECT_STATE.md`; history — `docs/CHANGELOG.md`; specification — `docs/keystone/specs/2026-08-05-portfolio-1-0-evidence-first.md`.\n\n'
          road_section = '''## 2026-08-14 accepted N6 full-site editorial UX + bounded copy polish

- **N6A full-site audit — DONE / RESEARCH ACCEPTED** via PR #231: 50/50 canonical routes, zero configured final warnings, Onest retained, eight bounded copy corrections selected.
- **N6C copy polish — DONE / PRODUCT ACCEPTED** via PR #233: bounded RU/EN reader-facing copy only; architecture, URLs, registries, typography and deep content ownership preserved.
- **Post-merge production verifier regression — CLOSED**: Production Live #561/#562 failed only because the RU no-JS verifier still required English `Context`; deployed RU content matched the accepted N6C copy.
- **Verifier correction — DONE / PRODUCTION ACCEPTED** via PR #234 / exact product SHA `635b4a0760765a515277ad8abcbb1500bf646027`; Pages #255, Production Live #564/#565 and master CodeQL #1662 are SUCCESS.
- **Durable N6 acceptance — DONE / PRODUCTION VERIFIED** via PR #236 / `01b4508355c33a81a5e9d1b5f5815a6c37318a9b`; Pages #256, Production Live #566/#567 and master CodeQL #1665 are SUCCESS. Ledger: `docs/acceptance/2026-08-14-n6-editorial-production-acceptance.md`.
- **N1–N6 presentation/editorial implementation is complete.** Do not start another unguided visual, copy, metadata or internal-link rewrite.
- **Next product/operator action remains controlled manual launch** using the accepted 10-target / 38-draft launch pack. Repository automation must not post, authenticate, schedule or mutate external publication state.
- After launch, continue P4.1B only from real authenticated/operator-supplied Search Console / Yandex Webmaster evidence. P4.1C and P3.6 remain evidence-gated; clean-URL clock remains `2026-08-05T00:00:00Z`.
- Maintenance remains independent: issue #82 is the upstream Diplodoc/markdown-it blocker (next review 2026-08-17); #78 requires fresh cross-repository evidence; #111 and #212 require authenticated operator/external observations.

'''
          road = insert_after(road, road_anchor, road_section, '## 2026-08-14 accepted N6', 'ROADMAP section')
          roadmap.write_text(road)

          change = changelog.read_text()
          change = replace_exact(
              change,
              '> Обновлено: **2026-08-13**, N2–N5 UX/content polish и Engineering Notes reader architecture #229 production-reconciled; controlled launch остаётся `not-published`, P4.1B review — IN PROGRESS / SPARSE PRE-LAUNCH BASELINE, P3.6/P4.1C остаются открытыми.',
              '> Обновлено: **2026-08-14**, N6 full-site editorial UX + bounded copy polish production-reconciled; controlled launch остаётся `not-published`, P4.1B review — IN PROGRESS / SPARSE PRE-LAUNCH BASELINE, P3.6/P4.1C остаются открытыми.',
              'CHANGELOG header',
          )
          change_anchor = '> Current state — `docs/PROJECT_STATE.md`; next steps — `docs/ROADMAP.md`; specification — `docs/keystone/specs/2026-08-05-portfolio-1-0-evidence-first.md`.\n\n'
          change_section = '''## 2026-08-14 — N6 full-site editorial UX + bounded copy polish — PRODUCTION ACCEPTED

- PR #231 completed the N6A full-site editorial audit: all 50 canonical routes classified; Tier 1 = 14, Tier 2 = 18, Tier 3 = 18; final configured warnings = 0; Onest retained; eight bounded N6C corrections selected. Squash `99af9cd2e9f31f124fb095cd2b7b2b23cc1e2a97`.
- PR #233 implemented the bounded N6C reader-facing copy set and preserved typography, URLs, registries, workflows, deep case studies and deep Notes architecture. Exact head `513243b7156227888a5ec9f3eecbe3e23939e3bd`; Build #2087 / `31725770799`, Dependency Review #1508 / `31725770759`, CodeQL #1658 / `31725770921` — SUCCESS; initial squash `ec4b0b7ead1117b2bb507e25e517400b36e771a1`.
- Production Live #561 / `31731621136` and #562 / `31731693651` then exposed one stale verifier contract: RU no-JS correctly used the new Russian labels while the production smoke still required English `Context` in both locales.
- PR #234 fixed only the verifier and added a regression contract. RED `088dceaea3edba7dfc3115a499fc8af797d99379`: 805 PASS / 1 intended FAIL. GREEN exact head `2f7ad5a11fef85e9d5e88028f6fba05674d4e637`: Build #2089 / `31744917904`, Dependency Review `31744917926`, CodeQL `31744917942` — SUCCESS.
- PR #234 squash / exact product SHA `635b4a0760765a515277ad8abcbb1500bf646027`: Pages #255 / `31745658299`, Production Live #564 / `31745658315`, deployment-triggered Production Live #565 / `31745724350` and master CodeQL #1662 / `31745658298` — SUCCESS. The previously failing Work with me smoke, P3.4A–F and favicon gates all passed.
- PR #236 merged the immutable N6 acceptance ledger as `01b4508355c33a81a5e9d1b5f5815a6c37318a9b`; Pages #256 / `31747501445`, Production Live #566 / `31747501412`, #567 / `31747551462` and master CodeQL #1665 / `31747501461` — SUCCESS. PR #235 was closed superseded; no open PR remains from the N6 sequence.
- No SEO/ranking/engagement/conversion claim is introduced. Controlled launch remains `not-published`; P4.1B remains sparse/in-progress; P4.1C and P3.6 remain waiting; clean-URL clock remains `2026-08-05T00:00:00Z`.

'''
          change = insert_after(change, change_anchor, change_section, '## 2026-08-14 — N6', 'CHANGELOG section')
          changelog.write_text(change)
          PY

          python - <<'PY'
          from pathlib import Path
          checks = {
              'docs/PROJECT_STATE.md': '## 0.6 2026-08-14 — N6 full-site editorial UX + bounded copy polish — PRODUCTION ACCEPTED',
              'docs/ROADMAP.md': '## 2026-08-14 accepted N6 full-site editorial UX + bounded copy polish',
              'docs/CHANGELOG.md': '## 2026-08-14 — N6 full-site editorial UX + bounded copy polish — PRODUCTION ACCEPTED',
          }
          for path, marker in checks.items():
              text = Path(path).read_text()
              assert text.count(marker) == 1, f'{path}: reconciliation marker count != 1'
              assert 'controlled launch' in text
              assert '`not-published`' in text
          PY

          git rm .github/workflows/tmp-reconcile-n6-state.yml
          git diff --check
          test -z "$(git status --short | awk '$2 !~ /^docs\/(PROJECT_STATE|ROADMAP|CHANGELOG)\.md$/ {print}')"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PROJECT_STATE.md docs/ROADMAP.md docs/CHANGELOG.md
          git commit -m 'docs: reconcile N6 production acceptance'
          git push origin HEAD:docs/reconcile-n6-state
