name: One-shot Content Freshness reconciliation

on:
  push:
    branches:
      - docs/content-freshness-reconcile-2026-08-11
    paths:
      - '.github/workflows/content-freshness-reconcile-migrate.yml'
      - 'scripts/content-freshness-reconcile-2026-08-11.mjs'

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: docs/content-freshness-reconcile-2026-08-11

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply fail-closed reconciliation migration
        run: node scripts/content-freshness-reconcile-2026-08-11.mjs

      - name: Prove focused GREEN contract
        run: node --test scripts/content-freshness-reconciliation-2026-08-11.test.js

      - name: Commit reconciled state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projects.json data/project-evidence.json data/project-history docs/PROJECT_STATE.md docs/ROADMAP.md docs/CHANGELOG.md docs/landing/projects/vlezet.md docs/en/projects/vlezet.md docs/landing/projects/livingworld.md docs/en/projects/livingworld.md
          git diff --cached --quiet && { echo 'Migration produced no changes'; exit 1; }
          git commit -m "docs: reconcile current project evidence"
          git push origin HEAD:docs/content-freshness-reconcile-2026-08-11
