name: C3 Durable Migration

on:
  push:
    branches:
      - docs/portfolio-clarity-c3-production-acceptance
    paths:
      - .github/workflows/c3-durable-migrate.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/portfolio-clarity-c3-production-acceptance
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Apply fail-closed durable migration
        run: node scripts/c3-durable-migrate.mjs

      - name: Remove one-shot migration files
        run: |
          rm scripts/c3-durable-migrate.mjs
          rm .github/workflows/c3-durable-migrate.yml

      - name: Commit migrated durable state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PROJECT_STATE.md docs/ROADMAP.md docs/CHANGELOG.md docs/acceptance/2026-08-10-portfolio-clarity-c3.md scripts/c3-durable-migrate.mjs .github/workflows/c3-durable-migrate.yml
          if git diff --cached --quiet; then
            echo 'ERROR: migration produced no staged change' >&2
            exit 1
          fi
          git commit -m 'docs: record C3 production acceptance'
          git push origin HEAD:docs/portfolio-clarity-c3-production-acceptance
